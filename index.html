    points.forEach((point, index) => {
      const dx = pt.x - point.x;
      const dy = pt.y - point.y;
      const dist = dx * dx + dy * dy;
      if (dist < matches[index].dist) matches[index] = {dist, len: pt.len};
    });
  }

  const lengths = matches.map((match, index) => {
    if (index === 0) return 0;
    if (index === points.length - 1) return totalLen;

    let bestLen = match.len;
    let bestDist = getPathDistanceToPoint(pointAtFrac, totalLen, bestLen, points[index]);
    let delta = coarseStepLen;

    for (let i = 0; i < 24; i++) {
      const leftLen = Math.max(0, bestLen - delta);
      const rightLen = Math.min(totalLen, bestLen + delta);
      const leftDist = getPathDistanceToPoint(pointAtFrac, totalLen, leftLen, points[index]);
      const rightDist = getPathDistanceToPoint(pointAtFrac, totalLen, rightLen, points[index]);

      if (leftDist < bestDist && leftDist <= rightDist) {
        bestLen = leftLen;
        bestDist = leftDist;
      } else if (rightDist < bestDist) {
        bestLen = rightLen;
        bestDist = rightDist;
      } else {
        delta /= 2;
      }
    }

    return bestLen;
  });

  for (let i = 1; i < lengths.length; i++) {
    if (lengths[i] < lengths[i - 1]) lengths[i] = lengths[i - 1];
  }

  return lengths;
}

// ── CARD REVEAL CHOREOGRAPHY ────────────────────────────────────────────
// Two distinct treatments, matching the two card designs:
//  - Landmark cards get a slower, typographic reveal: SplitText masks the
//    title in by word and the statutory quote in by line, like text being
//    set on a page, before the stamp/summary/link settle in.
//  - Marginal cards get a quick, quiet cascade: each line nudges in a beat
//    after the last, the way a reader's eye moves down a margin note.
// Both also trigger a brief pulse-ring "arrival" burst at the node itself.
// SplitText instances are cached per element (cardEl._titleSplit /
// _quoteSplit) so re-splitting never happens on repeat reveals.
function revealCard(cardEl, policy) {
  const tl = gsap.timeline();

  // Node "arrival" burst — a quick expanding, fading ring at the node itself,
  // independent of which card treatment is used. Reads the ring's own
  // current radius so it works regardless of mobile/desktop node sizing.
  if (cardEl._pulseRing && window.gsap) {
    const ring = cardEl._pulseRing;
    const baseR = parseFloat(ring.getAttribute('r')) || 10;
    gsap.fromTo(ring,
      { attr: { r: baseR }, opacity: 0.9 },
      { attr: { r: baseR * 2.4 }, opacity: 0, duration: 0.9, ease: 'power2.out' });
  }

  if (policy.landmark) {
    tl.fromTo(cardEl,
      { opacity: 0, y: 22, scale: 0.98 },
      { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: 'power2.out' });

    const titleEl = cardEl.querySelector('.split-title');
    if (titleEl && window.SplitText) {
      if (!cardEl._titleSplit) cardEl._titleSplit = SplitText.create(titleEl, { type: 'words', mask: 'words' });
      tl.from(cardEl._titleSplit.words,
        { yPercent: 120, opacity: 0, duration: 0.5, stagger: 0.04, ease: 'power3.out' }, '-=0.25');
    }

    const quoteEl = cardEl.querySelector('.split-quote');
    if (quoteEl && window.SplitText) {
      if (!cardEl._quoteSplit) cardEl._quoteSplit = SplitText.create(quoteEl, { type: 'lines', mask: 'lines' });
      tl.from(cardEl._quoteSplit.lines,
        { yPercent: 100, opacity: 0, duration: 0.55, stagger: 0.08, ease: 'power3.out' }, '-=0.15');
    }

    tl.from(cardEl.querySelectorAll('.reveal-el'),
      { opacity: 0, y: 8, duration: 0.4, stagger: 0.05, ease: 'power2.out' }, '-=0.3');
  } else {
    tl.fromTo(cardEl, { opacity: 0 }, { opacity: 1, duration: 0.2 });
    tl.from(cardEl.querySelectorAll('.reveal-el'),
      { opacity: 0, x: -6, duration: 0.35, stagger: 0.06, ease: 'power2.out' }, '-=0.05');
  }

  // Archival photo settles in after the text — word first, then image, echoing
  // the piece's "from the word to the law" thesis. The <figure> carries both
  // the photo and its credit line so they rise together.
  const figureEl = cardEl.querySelector('.policy-figure');
  if (figureEl) {
    tl.from(figureEl,
      { opacity: 0, y: 14, duration: 0.55, ease: 'power2.out' }, '-=0.1');
  }
  return tl;
}

// ── POLICY TYPE ICONS ─────────────────────────────────────────────────
function getPolicyIcon(type) {
  const t = type.toLowerCase();

  if (t.includes("law") || t.includes("act")) return "⚖";
  if (t.includes("executive") || t.includes("order")) return "✦";
  if (t.includes("court") || t.includes("decision")) return "§";
  if (t.includes("treaty")) return "◆";
  if (t.includes("constitutional") || t.includes("amendment")) return "★";
  if (t.includes("agreement")) return "◈";

  return "●";
}
// ── SCROLL-DRIVEN POLICY TIMELINE (GSAP ScrollTrigger) ─────────────────
function initPolicyTimeline() {
  if (tlInitialized) return;

  const svgEl = document.getElementById('timeline-viz');
  if (!svgEl || typeof d3 === 'undefined') return;

  tlSectionEl = document.getElementById('policy-history');
  const containerEl = tlSectionEl ? tlSectionEl.querySelector('.tl-timeline-container') : null;
  if (!tlSectionEl || !containerEl) return;

  tlInitialized = true;

  // Canvas river surface
  riverCanvas = document.getElementById('river-canvas');
  riverCtx = riverCanvas ? riverCanvas.getContext('2d') : null;
  resizeRiverCanvas();

  const svg = d3.select('#timeline-viz');
  const W = 1200, H = 800;
  const isMobileTimeline = window.matchMedia('(max-width: 768px)').matches;

  // ── SCALE-INDEPENDENT SIZING ───────────────────────────────────────────
  // The SVG is viewBox="0 0 1200 800" with the default preserveAspectRatio
  // ("xMidYMid meet"), so one viewBox unit is NOT one screen pixel: the
  // uniform scale is min(clientW/1200, clientH/800). On a 390px phone that is
  // 0.325; on a 1440x900 desktop it is 1.125 — a 3.5x difference. Any constant
  // written in raw viewBox units therefore renders 3.5x smaller on a phone
  // than on a desktop, which is what used to bunch every policy node into the
  // same ~300px of screen.
  //
  // So: author these in SCREEN PIXELS and convert. `px()` is the same
  // screen-px -> viewBox-unit conversion eraGapSVG already does with
  // `/ ctmScale` below; the two now share one definition.
  const ctmEarly = svgEl.getScreenCTM();
  const ctmScale = (ctmEarly && ctmEarly.d) ? ctmEarly.d : 1;
  const px = v => v / ctmScale;               // screen px → viewBox units

  const pathDataCenterX = W * 0.5;                            // path centered on full screen
  // Lane spread, also in screen px: at 0.325 the old 120-unit phone spread was
  // 39 real pixels, so the three lane labels sat on top of each other. 175 is
  // the desktop value today (156 units x 1.125).
  const tlXSpread = px(isMobileTimeline ? 120 : 175);        // lane spread
  const viewCenterX = pathDataCenterX;                        // overview only; follow phase ignores X

  // Vertical span of the path. Derived from a target on-screen gap between
  // consecutive policy nodes rather than a multiple of H, so the spacing a
  // reader actually sees is the same on every viewport. 330px is desktop's
  // measured median node gap today, so desktop is left where it was.
  // Phone needs a wider slot than desktop, not a narrower one: desktop cards
  // alternate left/right of the river so neighbours can overlap vertically
  // without colliding, while phone cards are centred under their node and
  // stack head-to-toe. 480 clears the tallest phone card (photo + card box,
  // capped to ~470px by the <=768px media block) with margin.
  const NODE_SPACING_PX = isMobileTimeline ? 810 : 560;
  const tlYSpan = px(policies.length * NODE_SPACING_PX);

  // Screen-pixel targets. The desktop numbers are the old viewBox constants
  // multiplied by 1.125 (the ctm scale at 1440x900), so a standard desktop
  // renders identically; the phone numbers are chosen to stay legible at
  // 0.325 instead of collapsing (the old 14u river was 4.6px wide, the old
  // 14u year label 3.9px tall).
  const bgPathWidth = px(isMobileTimeline ? 13 : 20.25);
  const animPathWidth = px(isMobileTimeline ? 11 : 18);
  const nodeRadius = px(isMobileTimeline ? 11 : 13.5);
  const nodeStrokeWidth = px(isMobileTimeline ? 2.5 : 2.8);
  const yearOffset = px(isMobileTimeline ? 26 : 31.5);
  const baseYearSize = px(isMobileTimeline ? 13 : 15.75);
  const activeYearSize = px(isMobileTimeline ? 22 : 31.5);
  const baseYearStrokeWidth = px(isMobileTimeline ? 2.5 : 3.4);
  const activeYearStrokeWidth = px(isMobileTimeline ? 3 : 4.5);
  const SHIP_SIZE = px(isMobileTimeline ? 64 : 95.6);  // ship image edge, screen px

  // Build path points: x snaps to three editorial lanes, y encodes time.
  // Vertical proportion allocated to each era comes from era.height — they
  // should sum to 1.0 across eras[].

// Vertical extent of each era, in viewBox units. `era.height` is an editorial
// weighting, not a density budget: era 6 carries 11 policies in height 0.16
// while era 1 carries 2 in height 0.10, so weighting alone gives era 6 less
// than half the per-node room (measured 182px vs 410px on a phone — the dense
// eras were still a pile-up even after the tlYSpan fix). On phones, floor each
// era at the room its own node count needs. Desktop keeps the pure weighting:
// with heights summing to 1.0, eraSpanVB/eraStartVB reduce exactly to the old
// `tlYSpan * era.height` / `tlYSpan * eraStarts[i]`.
const eraSpanVB = eras.map(era => {
  const safeEraHeight = Number.isFinite(era.height) ? era.height : ((era.endIndex - era.startIndex + 1) / Math.max(1, policies.length));
  const byWeight = tlYSpan * safeEraHeight;
  if (!isMobileTimeline) return byWeight;
  const count = era.endIndex - era.startIndex + 1;
  return Math.max(byWeight, px((count + 1) * NODE_SPACING_PX));
});
const eraStartVB = [];
let acc = 0;
for (let i = 0; i < eras.length; i++) {
  eraStartVB.push(acc);
  acc += eraSpanVB[i];
}

// Each era boundary (1..5) opens a tall vertical GAP in the river: an empty
// stretch the ship physically sails through while an opaque era panel scrolls
// past. `cumGap` is the running downward shift applied to every node from the
// era boundaries before it; two invisible waypoints carry the path through the
// middle of each gap. `gapAnchors` records each gap's span for panel placement.
// SVG units below the last node before the gap waypoints. On mobile, cards
// stack directly under their node (isMobileTimeline card placement) and need
// the same NODE_SPACING_PX of screen room as any other node. Desktop cards
// float beside the river instead, so it only needs a fraction of a full node
// gap — but that fraction is tied to NODE_SPACING_PX (not a flat constant)
// so the lead-in to an era panel scales along with node-to-node spacing
// instead of looking cramped by comparison whenever NODE_SPACING_PX changes.
const GAP_LEAD = isMobileTimeline ? px(NODE_SPACING_PX) : px(NODE_SPACING_PX) * 0.73;

// Per-era gap height, measured from the panel's actual content: eyebrow +
// title + narrative all flow together in the single content column, exactly
// as rendered, so the measurement box matches the real column width.
// ctmEarly / ctmScale are declared with the sizing constants above.
const viewportPx = window.innerHeight;
const contentBoxW = Math.min(720, window.innerWidth * (isMobileTimeline ? 0.9 : 0.64));
// Phone: the content column is the full panel width (.era-panel-content /
// -inner are max-width:100% of a 100vw panel, capped by the inner's own
// max-width:720px), minus the inner's 1.5rem L/R padding — NOT contentBoxW,
// which is a desktop-column figure. Keep in sync with
// `.era-panel-content-inner` padding in the phone @media block.
const textInnerW = isMobileTimeline
  ? (Math.min(window.innerWidth, 720) - 48)   // 2 × 1.5rem padding
  : (contentBoxW - 120);                      // 4.5rem + 3rem padding
const PAD_TOP_PX = isMobileTimeline ? 28 : 88;
const PAD_BOTTOM_PX = isMobileTimeline ? 40 : 56;
// Phone stacks the image as its own flex row (`.era-panel-image { flex: 0 0 30vh }`),
// so the panel is that much taller than the text column alone. Desktop puts the
// image beside the text, adding no height.
const IMAGE_PX = isMobileTimeline ? viewportPx * 0.30 : 0;
const GAP_TAIL_PX = viewportPx * 0.14;   // breathing room below the narrative
const eraGapSVG = eras.map((era, eraIndex) => {
  const meas = document.createElement('div');
  meas.style.cssText = `position:absolute;left:-9999px;top:0;width:${textInnerW}px;visibility:hidden;`;
  meas.innerHTML = `<span class="era-cover-eyebrow">Era ${eraIndex + 1} · ${era.dateRange || ''}</span>
    <h2 class="era-cover-title">${era.title}</h2>
    <div class="era-text-body">${era.narrative}</div>`;
  document.body.appendChild(meas);
  const textH = meas.offsetHeight;
  meas.remove();

  const panelPx = IMAGE_PX + PAD_TOP_PX + textH + PAD_BOTTOM_PX + GAP_TAIL_PX;
  const minPx   = viewportPx * (isMobileTimeline ? 1.1 : 0.6);   // floor so a short era still reads
  return Math.max(panelPx, minPx) / ctmScale;          // → SVG units
});

const points = [];          // full path: policy nodes + gap waypoints (geometry/motion)
const policyPoints = [];    // policy nodes only (nodes, cards, activeIndex logic)
const gapAnchors = [];      // { eraIndex, topY, bottomY } — one per era boundary

let cumGap = 0;
let prevEra = -1;   // -1 so era 0 also opens a leading gap — the journey starts ON the Era 1 panel

policies.forEach((policy, globalIndex) => {
  const eraIndex = getActiveEra(globalIndex);
  const era = eras[eraIndex];

  const count = era.endIndex - era.startIndex + 1;
  const localIndex = globalIndex - era.startIndex;
  // Important: use count + 1 so era boundary nodes do NOT overlap
  const localT = (localIndex + 1) / (count + 1);
  const baseY = H * 0.15 + eraStartVB[eraIndex] + localT * eraSpanVB[eraIndex];

  // Entering a new era → open its gap (two centered waypoints) first. The
  // leading gap (era 0) starts at the path top so the ship begins inside the
  // Era 1 panel; the river emerges at the panel's bottom edge. Later gaps start
  // just below the previous era's last node.
  if (eraIndex > prevEra) {
    const gapHeight = eraGapSVG[eraIndex];
    const prevNode = policyPoints[policyPoints.length - 1];
    const gapTopY = prevNode ? prevNode.y + GAP_LEAD : H * 0.15;
    const gapBottomY = gapTopY + gapHeight;
    points.push({ x: pathDataCenterX, y: gapTopY,    isGap: true });
    points.push({ x: pathDataCenterX, y: gapBottomY, isGap: true });
    gapAnchors.push({ eraIndex, topY: gapTopY, bottomY: gapBottomY });
    cumGap += gapHeight;
    prevEra = eraIndex;
  }

  const lane = POLICY_DOOR_LANES[getPolicyDoorLane(policy)];
  const node = {
    x: pathDataCenterX + lane.offset * tlXSpread,
    y: baseY + cumGap,
    lane: lane.label,
    index: globalIndex
  };
  points.push(node);
  policyPoints.push(node);
});

const pathBottomY = points[points.length - 1].y;

  // ── HERO UPSTREAM TAIL — real geometry, prepended to the motion/visual path.
  // The river extends upstream ABOVE points[0] (the seam) so the hero and the
  // timeline share ONE path, ONE river polyline and ONE camera. The tail arrives
  // at the seam dead-vertical, so the cardinal spline through
  // [...heroPoints, ...points] has C0/C1 continuity there (points[0]→points[1]
  // is already vertical at pathDataCenterX — both are era-0 gap waypoints).
  // Names are heroSeamPt / HERO_TAIL_UP / HERO_TAIL_STEPS to avoid colliding with
  // the legacy bridge block's heroSeam / HERO_TAIL_SPAN further below.
  const heroSeamPt = points[0];               // == (pathDataCenterX, H*0.15)
  const HERO_TAIL_UP = 640;                   // viewBox units authored ABOVE the seam
  const HERO_TAIL_STEPS = 40;
  const heroPoints = [];
  for (let i = 0; i < HERO_TAIL_STEPS; i++) {   // < not <=: do NOT duplicate the seam
    const tt = i / HERO_TAIL_STEPS;             // 0 = top of tail, →1 approaches seam
    const y = heroSeamPt.y - HERO_TAIL_UP * (1 - tt);
    const decay = (1 - tt) * (1 - tt);
    const meander = Math.sin((1 - tt) * Math.PI * 1.6) * 52 * decay;
    heroPoints.push({ x: heroSeamPt.x + meander, y, isHero: true });
  }
  const timelineStartIndex = heroPoints.length;   // index of the seam within unifiedPoints
  const unifiedPoints = [...heroPoints, ...points];

  // curveCardinal (not curveMonotoneY): passes through every node exactly, same
  // as before, but lets the river swing past each point with real overshoot
  // instead of the clamped, chart-legible bend monotoneY enforces. Tension
  // ~0.3–0.5 = loose, natural meander; 1.0 would collapse back to straight
  // segments between points.
  const line = d3.line().x(d => d.x).y(d => d.y).curve(d3.curveCardinal.tension(0.35));
  const pathData = line(unifiedPoints);   // unified: hero tail + timeline

  // ── CAMERA GROUP — all path/node content moves together ───────────────
  const cameraGroup = svg.append('g').attr('class', 'tl-camera');

  const laneLabelData = Object.values(POLICY_DOOR_LANES).map(lane => ({
    label: lane.label,
    x: pathDataCenterX + lane.offset * tlXSpread
  }));


  // Overview highlight path (slightly brighter, fades out as you zoom in)
  const overviewBgPath = cameraGroup.append('path').attr('class', 'tl-overview-bg').attr('d', pathData)
    .attr('fill', 'none').attr('stroke', 'rgba(192,161,58,0.26)')
    .attr('stroke-width', bgPathWidth + 2).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');

  // Background path
  cameraGroup.append('path').attr('class', 'tl-bg-path').attr('d', pathData)
    .attr('fill', 'none').attr('stroke', 'rgba(192,161,58,0.1)')
    .attr('stroke-width', bgPathWidth).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');

  // Geometry path — hidden via CSS (opacity:0). Serves as the MotionPathPlugin
  // source for the ship and as the basis for arc-length node measurements.
  const animPath = cameraGroup.append('path').attr('class', 'tl-anim-path').attr('d', pathData)
    .attr('fill', 'none').attr('stroke', POLICY_PATH_COLOR)
    .attr('stroke-width', animPathWidth).attr('stroke-linecap', 'round').attr('stroke-linejoin', 'round');

  // Nodes — policy nodes only (gap waypoints are invisible geometry)
  const nodeGroups = cameraGroup.selectAll('.tl-node').data(policyPoints).enter()
    .append('g').attr('class', 'tl-node')
    .attr('transform', d => `translate(${d.x},${d.y})`);

  nodeGroups.append('circle').attr('r', d => getRoleRadius(policies[d.index], nodeRadius))
    .attr('fill', d => `rgba(${getRoleRgb(policies[d.index])},0.22)`)
    .attr('stroke', d => getRoleColor(policies[d.index]))
    .attr('stroke-width', nodeStrokeWidth)
    .attr('stroke-dasharray', d => policies[d.index].role === 'contradiction' ? '3,2' : null);

  nodeGroups.filter(d => policies[d.index].role === 'rebuild').append('circle')
    .attr('class','tl-node-rebuild-ring')
    .attr('r', nodeRadius * 1.35).attr('fill','none')
    .attr('stroke', d => getRoleColor(policies[d.index]))
    .attr('stroke-width', nodeStrokeWidth * 0.65).attr('opacity',0.6);

  // Pulse-ring circles — one per node, invisible until a card reveal fires a
  // one-time "arrival" burst (see revealCard). Kept as separate elements so
  // this animation is never touched by applyFrame's per-node cosmetic
  // dirty-check restyle, which only targets the main node circle above.
  const pulseRingNodes = nodeGroups.append('circle')
    .attr('class', 'tl-node-pulse')
    .attr('r', d => getRoleRadius(policies[d.index], nodeRadius))
    .attr('fill', 'none')
    .attr('stroke', d => getRoleColor(policies[d.index]))
    .attr('stroke-width', 2)
    .style('opacity', 0)
    .style('pointer-events', 'none')
    .nodes();

  nodeGroups.append('text')
    .attr('class', 'tl-node-year')
    .attr('x', yearOffset)
    .attr('y', 4)
    .attr('text-anchor', 'start')
    .attr('fill', d => getRoleColor(policies[d.index]))
    .style('font-family', "'Space Mono', monospace")
    .style('font-size', `${baseYearSize}px`).style('font-weight', '400')
    .style('font-style', 'normal')
    .style('letter-spacing', '0.04em')
    .style('paint-order', 'stroke')
    .style('stroke', 'rgba(247,243,235,0.9)')
    .style('stroke-width', `${baseYearStrokeWidth}px`)
    .style('opacity', 0)
    .text(d => policies[d.index].year);

  // Fixed axis overlay — NOT in cameraGroup, stays screen-fixed
  const axis = svg.append('g').attr('class', 'tl-axis');

  const laneLabels = axis.selectAll('.tl-lane-label').data(laneLabelData).enter()
    .append('text')
      .attr('class', 'tl-lane-label')
      .attr('x', d => d.x).attr('y', px(38.25))
      .attr('text-anchor', 'middle')
      .attr('fill', 'rgba(192,161,58,0.7)')
      .style('font-family', "'Space Mono', monospace")
      // Screen px, not viewBox units: a literal '9px' here is 9 *user units*,
      // which the viewBox scale renders at 2.9px on a phone.
      .style('font-size', px(10.1) + 'px').style('letter-spacing', px(1.125) + 'px')
      .text(d => d.label);


  // SVG traveler ship — replaces the old traveler dot. Sits on the active node's
  // screen point (tipX, H/2) and rotates to the path tangent. Tracks per-frame.
  const ship = axis.append('image')
    .attr('class', 'tl-ship')
    .attr('href', SHIP_SRC)
    .attr('width', SHIP_SIZE)
    .attr('height', SHIP_SIZE)
    .attr('preserveAspectRatio', 'xMidYMid meet')
    .style('display', 'none')
    .style('filter', 'drop-shadow(0 0 10px rgba(192,161,58,0.55))');
  // Legacy xlink:href for maximum SVG renderer compatibility.
  ship.node().setAttributeNS('http://www.w3.org/1999/xlink', 'xlink:href', SHIP_SRC);

  const totalLen = animPath.node().getTotalLength();

  // ── MOTION-PATH SETUP (moved up from below) ────────────────────────────
  // Cache the raw path + arc-length measurements ONCE, then get every point
  // on the curve — for the node-length search and river samples right below,
  // AND for the per-frame ship position later — from GSAP's own cached,
  // pure-JS bezier math (getPositionOnPath) instead of the browser's native
  // SVGGeometryElement.getPointAtLength. See getNodePathLengths above for
  // why: native calls on this path's complexity measured 400x+ slower in
  // real WebKit.
  const rawPath = MotionPathPlugin.getRawPath(animPath.node());
  MotionPathPlugin.cacheRawPathMeasurements(rawPath);
  const pointAtFrac = frac => MotionPathPlugin.getPositionOnPath(rawPath, frac);

  // ── PATH SAMPLES ──────────────────────────────────────────────────────
  // Pre-sample the whole path ONCE, in raw SVG-viewBox coords, and reuse it for
  // both drawing the river and locating each node's arc-length below —
  // previously the two walked the same curve independently (a dedicated
  // ~8000-step scan for node lengths, plus this pass again for the river),
  // roughly doubling the number of path-geometry lookups an init needed.
  //
  // Resolution is a SCREEN-px target, not a fixed viewBox-unit step: totalLen
  // is expressed via px() (screen px / ctmScale — see the sizing constants
  // above), so a phone's smaller ctmScale inflates totalLen in viewBox units
  // for the same on-screen path length. A fixed-viewBox-unit step (the old
  // `totalLen / 6`) therefore over-sampled on a phone — every ~2 screen px
  // measured, vs desktop's ~6.75 screen px, for equally smooth output.
  // Sampling by screen px keeps cost proportional to what's actually drawn.
  const RIVER_SAMPLE_STEP_PX = 6.75;   // ≈ desktop's existing effective spacing
  const riverSampleCount = Math.max(160, Math.floor((totalLen * ctmScale) / RIVER_SAMPLE_STEP_PX));
  const riverSamples = new Array(riverSampleCount + 1);
  for (let i = 0; i <= riverSampleCount; i++) {
    const frac = i / riverSampleCount;
    const pt = pointAtFrac(frac);
    riverSamples[i] = { x: pt.x, y: pt.y, len: frac * totalLen };
  }

  // Measure per UNIFIED vertex, then slice back to timeline-relative indices so
  // all downstream node math keeps using the ORIGINAL points index (0 = seam).
  const unifiedAtLength = getNodePathLengths(pointAtFrac, unifiedPoints, totalLen, riverSamples);
  const timelineStartDistance = unifiedAtLength[timelineStartIndex];   // seam arc length
  const heroRiverDistance = timelineStartDistance;                     // hero portion length
  const timelineRiverDistance = totalLen - timelineStartDistance;      // timeline portion length
  const nodeAtLength = points.map((_, i) => unifiedAtLength[timelineStartIndex + i]);

  // ── SEA TAIL ──────────────────────────────────────────────────────────
  // Past the last node the river straightens out to run due south and widens
  // symmetrically around that vertical centerline — an estuary opening
  // evenly to both banks, not drifting sideways with whatever direction the
  // river's last bend happened to be heading. A short blend at the very
  // start eases from the path's actual end tangent into pure-vertical so
  // there's no visible kink at the handoff point. `tSea` (0→1) drives the
  // widen/darken interpolation in drawRiver.
  const seaLast = riverSamples[riverSamples.length - 1];
  const seaPrev = riverSamples[riverSamples.length - 2];
  let tanDx = seaLast.x - seaPrev.x, tanDy = seaLast.y - seaPrev.y;
  const tanLen = Math.hypot(tanDx, tanDy) || 1;
  tanDx /= tanLen; tanDy /= tanLen;
  const SEA_TAIL_SAMPLES = 48;
  const SEA_STRAIGHTEN_T = 0.18; // fraction of the tail over which it eases to vertical
  const seaSamples = [];
  let cx = seaLast.x, cy = seaLast.y;
  const stepLen = SEA_TAIL_LEN / SEA_TAIL_SAMPLES;
  for (let i = 1; i <= SEA_TAIL_SAMPLES; i++) {
    const tSea = i / SEA_TAIL_SAMPLES;
    const straightenAmt = Math.min(1, tSea / SEA_STRAIGHTEN_T);
    const dx = tanDx * (1 - straightenAmt) + 0 * straightenAmt;
    const dy = tanDy * (1 - straightenAmt) + 1 * straightenAmt;
    const dirLen = Math.hypot(dx, dy) || 1;
    cx += (dx / dirLen) * stepLen;
    cy += (dy / dirLen) * stepLen;
    seaSamples.push({ x: cx, y: cy, tSea });
  }

  // ── SOURCE LAKE ────────────────────────────────────────────────────────
  // The US silhouette is drawn on the river canvas as the HEAD of the current,
  // in the SAME world space as the river band. Its drain (lakeMouth, in the
  // map's own SVG-viewBox coords) is pinned to the river's origin — unifiedPoints[0],
  // where the band begins — so the river literally pours out of the lake. Because
  // it rides the camera transform, it flows away upward as the ship sails down.
  const lakePath  = (typeof Path2D !== 'undefined') ? new Path2D(US_MAP_PATH_D) : null;
  const LAKE_S    = 1.56;                      // map units → world units (30% larger)
  const lakeMouth = { x: 345, y: 392 };        // source point (map's translated 80,60 space): inland, within Texas — the river is born inside the land and flows down out through the coast
  const lakeSrc   = unifiedPoints[0];          // river origin in world space (600, seam−tail)
  // world = LAKE_S·raw + lakeB  (the map path was authored with a translate(80,60))
  const lakeBX = LAKE_S * (80 - lakeMouth.x) + lakeSrc.x;
  const lakeBY = LAKE_S * (60 - lakeMouth.y) + lakeSrc.y;
  // Vertical centre of the US silhouette in world space. The river's mouth is
  // pinned to screen-centre, which would leave the lake body hugging the top of
  // the frame; a hero framing lift (see applyFrame) pushes the scene down so the
  // lake's CENTRE — not its mouth — sits mid-page at rest.
  const LAKE_CENTER_RAWY = 190;                          // (minY+maxY)/2 of the US path (0..380)
  const lakeCenterWorldY = LAKE_S * LAKE_CENTER_RAWY + lakeBY;
  // Coastline left/right X sampled every 20 raw units down the US path (see
  // US_MAP_PATH_D), used to fit the hero title/subtitle to the ACTUAL local
  // coastline rather than the shape's overall bounding width — the Great Lakes
  // notch (~y180-220) and the Gulf/Maine tapers (below ~y240, above ~y40) make
  // the true width vary far more than a single bounding-box number captures.
  const LAKE_WIDTH_PROFILE = [
    [0, 67.2, 67.2], [20, 45.2, 153.0], [40, 42.0, 613.0], [60, 35.0, 617.5], [80, 24.5, 597.2],
    [100, 22.8, 595.2], [120, 15.8, 585.8], [140, 15.2, 570.5], [160, 23.8, 561.8], [180, 26.0, 561.5],
    [200, 32.5, 564.0], [220, 45.8, 563.5], [240, 65.0, 545.2], [260, 97.0, 525.8], [280, 131.0, 511.0],
    [300, 209.2, 512.5], [320, 218.5, 523.8], [340, 269.5, 533.0], [360, 281.0, 538.8], [380, 308.0, 308.0],
  ];
  function lakeWidthAtRawY(y) {
    y = Math.max(0, Math.min(380, y));
    for (let i = 0; i < LAKE_WIDTH_PROFILE.length - 1; i++) {
      const [y0, l0, r0] = LAKE_WIDTH_PROFILE[i];
      const [y1, l1, r1] = LAKE_WIDTH_PROFILE[i + 1];
      if (y >= y0 && y <= y1) {
        const t = (y - y0) / (y1 - y0);
        return (r0 + (r1 - r0) * t) - (l0 + (l1 - l0) * t);
      }
    }
    const last = LAKE_WIDTH_PROFILE[LAKE_WIDTH_PROFILE.length - 1];
    return last[2] - last[1];
  }

  function drawRiver(camTx, camTy, camScale, ctm, liftPx) {
    if (!riverCtx || !ctm) return;
    liftPx = liftPx || 0;   // hero framing offset (screen px, down) applied to lake + river
    const dpr = window.devicePixelRatio || 1;
    riverCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const cw = riverCanvas.width / dpr, ch = riverCanvas.height / dpr;
    riverCtx.clearRect(0, 0, cw, ch);

    // ── source lake — filled US silhouette at the river head, composed through
    // the same world→camera→screen transform, then the river band draws on top
    // so the drain seam is covered (same flat color = one continuous body). ──
    if (lakePath) {
      const scaleV = camScale * LAKE_S;
      const txV = camScale * lakeBX + camTx;
      const tyV = camScale * lakeBY + camTy;
      riverCtx.setTransform(
        dpr * (ctm.a * scaleV), dpr * (ctm.b * scaleV),
        dpr * (ctm.c * scaleV), dpr * (ctm.d * scaleV),
        dpr * (ctm.a * txV + ctm.c * tyV + ctm.e),
        dpr * (ctm.b * txV + ctm.d * tyV + ctm.f + liftPx)
      );
      riverCtx.fillStyle = RIVER_COLOR;
      riverCtx.fill(lakePath);
      riverCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    const toScreen = (sx, sy) => {
      const vx = camTx + camScale * sx;
      const vy = camTy + camScale * sy;
      return { x: ctm.a * vx + ctm.c * vy + ctm.e, y: ctm.b * vx + ctm.d * vy + ctm.f + liftPx };
    };

    // ── main river — unchanged flat-blue band through the policy nodes ──
    riverCtx.beginPath();
    for (let i = 0; i < riverSamples.length; i++) {
      const s = riverSamples[i];
      const p = toScreen(s.x, s.y);
      if (i === 0) riverCtx.moveTo(p.x, p.y);
      else         riverCtx.lineTo(p.x, p.y);
    }
    riverCtx.lineJoin = 'round';
    riverCtx.lineCap = 'round';
    riverCtx.shadowBlur = 0;
    riverCtx.shadowColor = 'transparent';
    riverCtx.strokeStyle = RIVER_COLOR;
    riverCtx.lineWidth = Math.max(1, RIVER_W * camScale * ctm.a);
    riverCtx.stroke();

    // ── estuary — the river widens and deepens in color past the last node ──
    let mouthScreen = null;
    let prevPt = toScreen(seaLast.x, seaLast.y);
    for (let i = 0; i < seaSamples.length; i++) {
      const s = seaSamples[i];
      const p = toScreen(s.x, s.y);
      riverCtx.beginPath();
      riverCtx.moveTo(prevPt.x, prevPt.y);
      riverCtx.lineTo(p.x, p.y);
      riverCtx.lineWidth = Math.max(1, RIVER_W * (1 + s.tSea * SEA_TAIL_WIDEN) * camScale * ctm.a);
      riverCtx.strokeStyle = lerpColor(RIVER_COLOR, SEA_COLOR, s.tSea);
      riverCtx.stroke();
      prevPt = p;
      mouthScreen = p;
    }

    // ── open sea — once the estuary mouth has scrolled into view, fill the
    // rest of the frame below it with a single flat color and a soft wavy
    // top edge — matching the reference art's style: one solid wave shape
    // against the paper, no gradient, no horizon line, no water texture. ──
    if (mouthScreen && mouthScreen.y < ch + 240) {
      const baseY = mouthScreen.y - 10;
      riverCtx.beginPath();
      riverCtx.moveTo(0, baseY + Math.sin(0) * 46);
      for (let x = 0; x <= cw; x += 20) {
        const y = baseY + Math.sin((x / cw) * Math.PI * 1.4 + 0.6) * 46;
        riverCtx.lineTo(x, y);
      }
      riverCtx.lineTo(cw, ch);
      riverCtx.lineTo(0, ch);
      riverCtx.closePath();
      riverCtx.fillStyle = SEA_COLOR;
      riverCtx.fill();
    }
  }

  // Colored background segments — one per inter-node interval, tinted by the
  // destination node's lane. Segments touching a gap waypoint (no .index) use
  // the neutral river color. Inserted before the animated path so the gold
  // progress stroke draws on top.
  for (let i = 0; i < points.length - 1; i++) {
    const dest = points[i + 1];
    const segColor = dest.isGap ? RIVER_COLOR : getRoleColor(policies[dest.index]);
    const segLen = nodeAtLength[i + 1] - nodeAtLength[i];
    cameraGroup.insert('path', '.tl-anim-path')
      .attr('class', 'tl-seg-path')
      .attr('d', pathData)
      .attr('fill', 'none')
      .attr('stroke', segColor)
      .attr('stroke-width', bgPathWidth)
      .attr('stroke-linecap', 'round')
      .attr('stroke-linejoin', 'round')
      .attr('stroke-dasharray', `${segLen} ${totalLen + 10}`)
      .attr('stroke-dashoffset', -nodeAtLength[i]);
  }

  // ── OVERVIEW CAMERA CONSTANTS ─────────────────────────────────────────
  // pathBottomY now includes the era gaps, so the overview fits the full
  // gapped path (a tall thin line during the brief overview phase).
  const pathCenterX = pathDataCenterX;
  const pathCenterY = (H * 0.15 + pathBottomY) / 2;
  const pathTotalHeight = pathBottomY + H * 0.05;
  const overviewScale = (H * 0.82) / pathTotalHeight;
  const overviewTx = viewCenterX - overviewScale * pathCenterX;
  const overviewTy = H / 2 - overviewScale * pathCenterY;

  // Compute overviewX for each lane label — the screen x of each lane in overview phase
  laneLabelData.forEach(lane => {
    lane.overviewX = lane.x * overviewScale + overviewTx;
  });

  function easeInOut(t) { return t < 0.5 ? 2*t*t : -1 + (4 - 2*t)*t; }

  // `rawPath` is already built (see "MOTION-PATH SETUP (moved up from below)"
  // near totalLen above) — it's cached once and reused for the ship's
  // position/angle and the follow camera via getPositionOnPath() every frame.
  const nodeFrac = nodeAtLength.map(l => l / totalLen);   // arc-length fraction per node
  const f_seam = nodeFrac[0];   // = timelineStartDistance/totalLen — where the timeline begins

  // ── TIME BUDGET ───────────────────────────────────────────────────────
  const segLen = [];
  for (let i = 0; i < points.length - 1; i++) {
    segLen.push(Math.max(1, nodeAtLength[i + 1] - nodeAtLength[i]));
  }
  const OV_DUR = 0, ZOOM_DUR = 0;
  const T_OV = 0, T_ZOOM = 0;

  // The ship traveler proxy (`frac` = arc-length position along the path); the
  // follow camera is derived from it, so this is the only animated state.
  const nav = { frac: 0 };

  // ── SHIP RENDER + IDLE ROCK ───────────────────────────────────────────
  // applyFrame writes the ship's path-derived state into shipRender; renderShip()
  // composes the final transform. A small heading wobble (idleRock.phase) is
  // layered on ONLY while the boat is moored at the source and fades out as the
  // reader scrolls in (shipRender.idle). It is purely cosmetic — it never touches
  // position or the camera — so nav.frac stays the single driver of movement
  // (CLAUDE.md constraint #1). renderShip is also registered on gsap.ticker so the
  // rock keeps animating at rest, when applyFrame (scroll-driven) is idle.
  const shipRender = { x: 0, y: 0, angle: 0, idle: 0, shown: false };
  const idleRock = { phase: 0 };
  const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ROCK_AMP_DEG = 3;   // gentle ± heading wobble at the source
  function renderShip() {
    if (!shipRender.shown) return;
    const rock = Math.sin(idleRock.phase) * ROCK_AMP_DEG * shipRender.idle;
    ship.attr('transform',
      `translate(${shipRender.x - SHIP_SIZE / 2},${shipRender.y - SHIP_SIZE / 2}) rotate(${shipRender.angle + SHIP_ANGLE_OFFSET + rock} ${SHIP_SIZE / 2} ${SHIP_SIZE / 2})`);
  }
  // Clean up any tween/ticker left by a previous init (resize / font-swap reinit
  // runs a fresh closure — without this each reinit would leak another perpetual
  // tween and another ticker callback bound to a now-detached ship node).
  if (tlIdleRockTween) { tlIdleRockTween.kill(); tlIdleRockTween = null; }
  if (tlShipTicker) { gsap.ticker.remove(tlShipTicker); tlShipTicker = null; }
  if (!prefersReducedMotion) {
    tlShipTicker = renderShip;
    gsap.ticker.add(renderShip);
    tlIdleRockTween = gsap.to(idleRock, { phase: Math.PI * 2, duration: 3.8, repeat: -1, ease: 'none' });
  }

  // Hero DOM elements faded by applyFrame (driven by the same nav.frac, so no
  // second animated driver). Cached once here.
  const tlHeroInner  = document.querySelector('.tl-intro-inner');

  // ── CLOSING-RECAP STATE ───────────────────────────────────────────────
  let T_FOLLOW_END = Infinity, outroDur = 1;
  let recapPathEl = null, recapPathLen = 0, recapNodeEls = null;
  let recapEyebrow = null, recapLine1 = null, recapLine2 = null;
  let recapEngaged = false;   // true while the recap is faded in; gates a one-time scene restore

  // Cached SVG→screen matrix. getScreenCTM() forces a style/layout flush, and it
  // was being called every scroll frame — but the matrix is constant while the
  // fixed .tl-viz-wrapper stays put. It only changes on resize or a font swap,
  // and both of those run reinitPolicyTimeline() (a fresh closure), so caching it
  // here for the life of this init is safe and takes the read off the hot path.
  let tlScreenCTM = null;
  function getScreenCTMCached() {
    if (!tlScreenCTM) tlScreenCTM = svgEl.getScreenCTM();
    return tlScreenCTM;
  }

  function applyFrame() {
    if (!tlSectionEl || !tlMasterTl) return;
    const t = tlMasterTl.time();
    const followPhase = t > T_ZOOM + 1e-4;

    // Computed early (not just at the closing-text step below) because the
    // ship/camera also use it: once the last node is reached, the ship keeps
    // sailing a little further into the estuary instead of stopping dead.
    const outroT = T_FOLLOW_END === Infinity
      ? 0
      : Math.min(1, Math.max(0, (t - T_FOLLOW_END) / outroDur));

    // ── SHIP POSITION (MotionPathPlugin) — also feeds the follow camera ──
    // Position AND heading come straight from the path at nav.frac, including at
    // rest (frac 0). Previously the rest angle was hard-coded to 0 while the
    // sailing angle used the path tangent, so the boat snapped ~90° (horizontal→
    // vertical) on the first scroll pixel. Reading the tangent at frac 0 too means
    // it already points down-river at the source, with no discontinuity.
    const pos = MotionPathPlugin.getPositionOnPath(rawPath, Math.min(1, Math.max(0, nav.frac)), true);
    let shipX = pos.x, shipY = pos.y, shipAngle = pos.angle;
    if (followPhase && outroT > 0) {
      const seaProgress = easeInOut(outroT) * SEA_SHIP_TRAVEL;
      shipY += seaProgress;
      // Match the estuary's own straightening (see seaSamples above) so the
      // boat's heading turns to due-south in step with the channel instead
      // of holding the river's last-bend angle while it drifts vertically.
      const straightenAmt = Math.min(1, (seaProgress / SEA_TAIL_LEN) / SEA_STRAIGHTEN_T);
      shipAngle += (90 - shipAngle) * straightenAmt;
    }

    // ── HERO ⇄ TIMELINE GATE ──────────────────────────────────────────────
    // Timeline semantics (node cosmetics, era bg, card reveals) engage only from
    // the seam onward. Before it we are in the hero: pure river+ship+camera on
    // the extended path. The hero DOM fades are driven off the SAME nav.frac.
    const inTimeline = nav.frac >= f_seam - 1e-4;
    const heroP = f_seam > 0 ? Math.min(1, Math.max(0, nav.frac / f_seam)) : 1;
    // At rest (heroP≈0) leave inline opacity unset so the CSS `.is-visible`
    // entrance fade (0→1 over 0.9s) owns the title. Only once the reader
    // starts scrolling do we take over with the inline scroll-out fade. Clearing
    // it again at the top restores class control (clean fade back in on scroll-up).
    const heroFade = String(1 - Math.min(1, heroP / 0.5));
    if (tlHeroInner)  tlHeroInner.style.opacity = heroP <= 0.001 ? '' : heroFade;
    // The lake needs no opacity handling: it's drawn on the river canvas in world
    // space (see drawLake in drawRiver) and simply pans away with the current.

    // ── HERO FRAMING LIFT ─────────────────────────────────────────────────
    // The river's mouth is pinned to screen-centre, which alone leaves the lake
    // hugging the top of the frame. Push the whole hero scene (lake, river, ship,
    // title, AND the SVG cameraGroup) DOWN so the lake's centre sits mid-page at
    // rest, then ease that lift to 0 by the seam so the timeline frames normally.
    // Everything is shifted by the SAME lift so they stay locked together.
    const screenCTM = getScreenCTMCached();
    let heroLiftPx = 0;
    if (screenCTM && screenCTM.d) {
      const camTy0r = H / 2 - unifiedPoints[0].y;            // rest camera translate
      const lakeCenterScreenRest = screenCTM.d * (camTy0r + lakeCenterWorldY) + screenCTM.f;
      const restLiftPx = window.innerHeight / 2 - lakeCenterScreenRest;
      heroLiftPx = restLiftPx * (1 - heroP);                 // full at rest → 0 at the seam
    }
    const liftVB = (screenCTM && screenCTM.d) ? heroLiftPx / screenCTM.d : 0;  // px → viewBox units

    // ── CAMERA ── vertical-only follow of the ship; no overview/zoom phase.
    // camTy carries the framing lift so the SVG path/overview align with the
    // lifted canvas river (no exposed guide-path stripe).
    const camTx = 0, camScale = 1, camTy = H / 2 - shipY + liftVB;
    cameraGroup.attr('transform', `translate(${camTx},${camTy}) scale(${camScale})`);

    // ── RIVER ── redraw the flat-blue band. The canvas river/lake are placed in
    // screen space, so they take the lift directly (drawRiver adds heroLiftPx);
    // camTy already includes liftVB, so passing lift again would double it — the
    // canvas path is built from camTy too. Pass 0 lift to drawRiver and rely on
    // camTy, keeping canvas + SVG on the identical transform.
    drawRiver(camTx, camTy, camScale, screenCTM, 0);

    // ── TITLE LOCKED TO THE LAKE ──────────────────────────────────────────
    // position:fixed, so it has no scroll motion of its own. Drive it by the same
    // camTy + heroLiftPx that place the lake → it rides the lake in exact lockstep.
    if (tlHeroInner && screenCTM) {
      // Fit the block inside the lake: pin its centre to the lake's centre (which
      // the framing lift puts mid-viewport at rest) and track it on scroll, so it
      // rides the lake in lockstep and never spills past the coastline.
      const lakeCenterScreen = screenCTM.d * (camTy + lakeCenterWorldY) + screenCTM.f;
      const delta = lakeCenterScreen - window.innerHeight / 2;
      tlHeroInner.style.transform = `translateY(calc(-50% + ${delta}px))`;
      // Cap the block's width to the coastline over a FIXED band around the
      // lake's centre, rather than the shape's overall bounding width, so it
      // wraps to stay inside the coastline instead of overhanging a local
      // narrow point like the Great Lakes notch or the Gulf/Maine tapers.
      // Deliberately NOT measured from the block's own current rendered rect:
      // that reads back this frame's height to size next frame's width, and a
      // width just narrow enough to force one more line makes the box taller,
      // which then reads back an even narrower width — a feedback loop that
      // collapsed to a sliver on a real device where font metrics wrapped the
      // title one line taller than in testing, pushing "Who" above the lake's
      // northern tip into the sky (invisible there: cream text on cream sky).
      // TITLE_BAND_RAW is sized for ~2-3 lines either side of centre.
      const TITLE_BAND_RAW = 50;
      const safeRawWidth = Math.min(
        lakeWidthAtRawY(LAKE_CENTER_RAWY - TITLE_BAND_RAW),
        lakeWidthAtRawY(LAKE_CENTER_RAWY),
        lakeWidthAtRawY(LAKE_CENTER_RAWY + TITLE_BAND_RAW)
      );
      const maxWidthPx = safeRawWidth * LAKE_S * camScale * screenCTM.a * 0.86;
      tlHeroInner.style.maxWidth = Math.max(240, maxWidthPx) + 'px';
    }

    // ── LANE LABELS ──
    const laneFollowRaw = t <= T_OV ? 0 : t <= T_ZOOM ? (t - T_OV) / ZOOM_DUR : 1;
    const laneFollowT = laneFollowRaw <= 0 ? 0 : laneFollowRaw >= 1 ? 1 : easeInOut(laneFollowRaw);
    // Hidden through the hero (where they'd collapse onto one another at the top
    // and read as garble); fade in over the last stretch as the timeline begins.
    const laneReveal = Math.max(0, Math.min(1, (heroP - 0.85) / 0.15));
    laneLabels
      .attr('x', d => {
        const cameraX = d.x * camScale + camTx;
        const targetX = laneFollowT === 1
          ? Math.max(20, Math.min(W - 20, cameraX))
          : cameraX;
        return d.overviewX + (targetX - d.overviewX) * laneFollowT;
      })
      .style('opacity', d => {
        if (laneReveal <= 0) return 0;
        if (laneFollowT < 1) return laneReveal;
        const cameraX = d.x * camScale + camTx;
        return (cameraX >= -80 && cameraX <= W + 80) ? laneReveal : 0;
      });

    // ── OVERVIEW HIGHLIGHT FADE ──
    const overviewFade = t <= T_OV ? 1 : t <= T_ZOOM ? 1 - (t - T_OV) / ZOOM_DUR : 0;
    overviewBgPath.style('opacity', overviewFade);

    // ── SHIP RENDER ── one boat rides the whole current: it's moored at the lake
    // mouth at rest (screen centre) and sails downstream once scrolling begins.
    ship.style('display', null);
    const sailAwayT = followPhase ? easeInOut(Math.min(1, outroT / 0.9)) : 0;
    ship.style('opacity', String(1 - sailAwayT));
    // Ship rides at screen-centre (camera keeps it there); add the hero framing
    // lift (converted screen px → viewBox units) so it stays at the lake mouth.
    const shipLiftVB = screenCTM && screenCTM.d ? heroLiftPx / screenCTM.d : 0;
    // Hand the path-derived state to renderShip (also driven by gsap.ticker so the
    // idle rock animates at rest). The rock is full at the source and eases out by
    // the time the hero is a quarter scrolled in, so the sailing boat never wobbles.
    shipRender.x = shipX;
    shipRender.y = H / 2 + shipLiftVB;
    shipRender.angle = shipAngle;
    shipRender.idle = Math.max(0, 1 - heroP / 0.25);
    shipRender.shown = true;
    renderShip();

    // ── NODE STATE ──
    let passedIndex = -1, activeIndex = -1;
    if (followPhase && inTimeline) {
      for (let i = 0; i < policyPoints.length; i++) {
        if (shipY >= policyPoints[i].y - 0.5) passedIndex = policyPoints[i].index; else break;
      }
      let best = -1, bestGap = Infinity;
      for (let i = 0; i < policyPoints.length; i++) {
        const gap = Math.abs(shipY - policyPoints[i].y);
        if (gap < bestGap) { bestGap = gap; best = policyPoints[i].index; }
      }
      activeIndex = best;
    }

    // ── ERA SYNC ──
    if (followPhase) {
      const nodeForEra = Math.max(passedIndex, activeIndex);
      const walkEraIdx = nodeForEra >= 0 ? getActiveEra(nodeForEra) : -1;
      if (walkEraIdx >= 0 && walkEraIdx !== eraCurrentIndex) {
        eraCurrentIndex = walkEraIdx;
      }
    } else if (eraCurrentIndex !== -1) {
      eraCurrentIndex = -1;
    }

    // ── SCROLL-PROGRESS INDICATOR ── tracks the whole section, not just eras ──
    if (tlProgressFill && tlMasterTl) {
      const totalDur = tlMasterTl.duration();
      const progress = totalDur > 0 ? Math.min(1, Math.max(0, t / totalDur)) : 0;
      tlProgressFill.style.transform = `scaleX(${progress.toFixed(4)})`;
    }

    // Node cosmetics — only re-apply when (activeIndex, passedIndex) change.
    const nodeStateDirty = activeIndex !== tlLastActiveIndex || passedIndex !== tlLastPassedIndex;
    if (nodeStateDirty) {
      tlLastActiveIndex = activeIndex;
      tlLastPassedIndex = passedIndex;

    cameraGroup.selectAll('g.tl-node circle').each(function(d) {
      const rgb = getRoleRgb(policies[d.index]);
      if (d.index === activeIndex)
        d3.select(this).style('filter', `drop-shadow(0 0 20px rgba(${rgb},0.9))`);
      else if (d.index < passedIndex)
        d3.select(this).style('filter', `drop-shadow(0 0 12px rgba(${rgb},0.6))`);
      else
        d3.select(this).style('filter', 'none');
    });

    cameraGroup.selectAll('g.tl-node text.tl-node-year').each(function(d) {
      const year = d3.select(this);
      const lane = getPolicyDoorLane(policies[d.index]);
      const rgb  = getRoleRgb(policies[d.index]);
      const roleColor = getRoleColor(policies[d.index]);
      if (d.index === activeIndex) {
        year
          .attr('fill', roleColor)
          .style('font-size', `${activeYearSize}px`)
          .style('font-weight', '700')
          .style('stroke', 'rgba(247,243,235,0.96)')
          .style('stroke-width', `${activeYearStrokeWidth}px`)
          .style('filter', `drop-shadow(0 0 10px rgba(${rgb},0.45))`)
          .style('opacity', '1');
      } else if (d.index < passedIndex) {
        year
          .attr('fill', roleColor)
          .style('font-size', `${baseYearSize}px`)
          .style('font-weight', '400')
          .style('stroke', 'rgba(247,243,235,0.9)')
          .style('stroke-width', `${baseYearStrokeWidth}px`)
          .style('filter', 'none')
          .style('opacity', '0.12');
      } else {
        year
          .attr('fill', roleColor)
          .style('font-size', `${baseYearSize}px`)
          .style('font-weight', '600')
          .style('stroke', 'rgba(247,243,235,0.85)')
          .style('stroke-width', `${baseYearStrokeWidth}px`)
          .style('filter', 'none')
          .style('opacity', '0.5');
      }
    });
    } // end nodeStateDirty

    // Completion state — all policies have been passed
    const vizWrapper = document.querySelector('.tl-viz-wrapper');
    if (vizWrapper) vizWrapper.classList.toggle('tl-complete', passedIndex >= policies.length - 1);

    // ── CARD TRAIL + ERA WORLD LAYER ───────────────────────────────────
    if (tlCardLayer && followPhase) {
      tlCardLayer.style.transform = `translateY(${(tlCardScaleY * camTy).toFixed(2)}px)`;
    }
    if (tlEraWorldLayer) {
      if (followPhase) {
        tlEraWorldLayer.style.visibility = 'visible';
        tlEraWorldLayer.style.transform = `translateY(${(tlEraScaleY * camTy).toFixed(2)}px)`;
      } else {
        tlEraWorldLayer.style.visibility = 'hidden';
      }
    }

    if (nodeStateDirty) {
      for (let i = 0; i < tlCards.length; i++) {
        const cardEl = tlCards[i];
        if (!cardEl) continue;
        const shouldShow = followPhase && activeIndex >= 0 && i <= activeIndex;
        const shown = cardEl.dataset.shown === '1';
        const transitionEl = cardEl.querySelector('.story-transition');
        if (transitionEl) transitionEl.classList.toggle('is-visible', followPhase && activeIndex > i);
        if (shouldShow && !shown) {
          cardEl.dataset.shown = '1';
          gsap.killTweensOf(cardEl);
          revealCard(cardEl, policies[i]);
        } else if (!shouldShow && shown) {
          cardEl.dataset.shown = '0';
          gsap.killTweensOf(cardEl);
          gsap.to(cardEl, { opacity: 0, duration: 0.3, overwrite: true });
          if (cardEl._pulseRing) { gsap.killTweensOf(cardEl._pulseRing); gsap.set(cardEl._pulseRing, { opacity: 0 }); }
        }
      }
    }

    // ── CLOSING TEXT REVEAL ──────────────────────────────────────────────
    // The river/ship layer is deliberately left alone here — it's not being
    // replaced by a separate scene, it *is* the ending (the estuary/sea the
    // ship has been sailing into). The text only pops in once the ship has
    // finished sailing/fading (outroT past TEXT_APPEAR_AT, same point sailAwayT
    // above settles) — it must never appear to travel with the boat.
    const TEXT_APPEAR_AT = 0.9;
    if (tlRecapLayer) {
      if (outroT > 0 && tlSectionActive) {
        recapEngaged = true;
        tlRecapLayer.style.opacity = '1';
        if (tlCardLayer)      tlCardLayer.style.opacity = '0';
        if (tlEraWorldLayer)  tlEraWorldLayer.style.opacity = '0';

        const shown = outroT >= TEXT_APPEAR_AT ? '1' : '0';
        if (recapEyebrow) recapEyebrow.style.opacity = shown;
        if (recapLine1)   recapLine1.style.opacity   = shown;
        if (recapLine2)   recapLine2.style.opacity   = shown;
      } else if (recapEngaged) {
        recapEngaged = false;
        tlRecapLayer.style.opacity = '0';
        if (tlCardLayer)     tlCardLayer.style.opacity = '';
        if (tlEraWorldLayer) tlEraWorldLayer.style.opacity = '';
      }
    }
  }

  // ── PRE-RENDERED CARD LAYER ──────────────────────────────────────────
  const ctm = svgEl.getScreenCTM();
  if (ctm) {
    tlCardScaleY = ctm.d;
    const CARD_GAP    = isMobileTimeline ? 24 : 300;
    const EDGE_MARGIN = isMobileTimeline ? 12 : 16;
    const CARD_WIDTH  = Math.min(isMobileTimeline ? 320 : 480,
                                 window.innerWidth - EDGE_MARGIN * 2);

    const layer = document.createElement('div');
    layer.className = 'tl-card-layer';
    layer.style.cssText =
      'position:fixed;inset:0;z-index:100;pointer-events:none;transform-origin:0 0;will-change:transform;';
    document.body.appendChild(layer);
    tlCardLayer = layer;
    tlCards = new Array(policies.length).fill(null);

    policies.forEach((policy, i) => {
      const lane = getPolicyDoorLane(policy);
      const dir  = i % 2 === 0 ? 1 : -1;
      const nodeX = ctm.a * policyPoints[i].x + ctm.e;
      // Desktop/tablet: alternate the card left/right of its node. Phones have no
      // horizontal room beside a centred river, so the beside-node math just
      // clamps every card into a narrow pile on top of the ship — instead, centre
      // the card and (in `tops` below) drop it just under the node. `.left`/`.right`
      // reflect the intended side; inline left/top still own actual placement.
      const rawLeft = dir === 1 ? nodeX + CARD_GAP : nodeX - CARD_GAP - CARD_WIDTH;
      const left = isMobileTimeline
        ? Math.max(EDGE_MARGIN, (window.innerWidth - CARD_WIDTH) / 2)
        : Math.max(EDGE_MARGIN, Math.min(window.innerWidth - CARD_WIDTH - EDGE_MARGIN, rawLeft));

      const cardEl = document.createElement('div');
      cardEl.className = `policy-item ${dir === 1 ? 'right' : 'left'}`;
      cardEl.dataset.shown = '0';
      // No per-card will-change: the parent .tl-card-layer is what pans every
      // frame (it keeps will-change:transform); promoting all ~34 cards to their
      // own compositor layers just burns memory, especially on mobile. Each card
      // only animates briefly during its reveal, which doesn't need a standing hint.
      cardEl.style.cssText = `position:absolute;left:${left}px;top:0;width:${CARD_WIDTH}px;opacity:0;transform:none;`;

      // Archival photo + credit line, shared by both card treatments. Wrapped
      // in a <figure> so the image and its caption reveal (and pan) as one unit.
      const photoHTML = policy.image ? `
          <figure class="policy-figure${policy.landmark ? ' policy-figure-landmark' : ''}">
            <img class="policy-photo" src="${policy.image}" alt="${policy.title}" loading="lazy" decoding="async">
            ${policy.imageCaption ? `<figcaption class="policy-caption">${policy.imageCaption}</figcaption>` : ''}
          </figure>` : '';

      const roleLabel = ROLE_LABELS[policy.role] || policy.role;
      const roleColor = getRoleColor(policy);
      if (policy.landmark) {
        cardEl.innerHTML = `
          ${photoHTML}
          <div class="landmark-card card-box" style="--role-color:${roleColor}">
            <div class="landmark-stamp reveal-el" style="border-color:${roleColor};color:${roleColor}">${policy.stamp || policy.year}</div>
            <div class="landmark-eyebrow reveal-el" style="color:${roleColor}">${roleLabel}</div>
            <div class="landmark-title split-title">${policy.title}</div>
            <div class="landmark-anchor reveal-el">${policy.anchor}</div>
            ${policy.quote ? `<div class="landmark-quote split-quote" style="border-left-color:${roleColor}">${policy.quote}</div>` : ''}
            <p class="landmark-summary reveal-el">${policy.cardText}</p>
            <button class="landmark-link reveal-el" style="border-bottom-color:${roleColor}" onclick="openDossier(${i})">Open dossier <svg viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6 2l4 4-4 4" stroke="currentColor" stroke-width="1.6"/></svg></button>
          </div>
          <div class="story-transition" style="--role-color:${roleColor}">${policy.transition}</div>`;
      } else {
        cardEl.innerHTML = `
          ${photoHTML}
          <div class="margin-card card-box" data-lane="${lane}" data-role="${policy.role}" style="--role-color:${roleColor}">
            <span class="margin-year reveal-el">${policy.year}</span>
            <div class="story-role reveal-el">${roleLabel}</div>
            <div class="margin-title reveal-el">${policy.title}</div>
            <div class="story-anchor reveal-el">${policy.anchor}</div>
            <p class="margin-summary reveal-el">${policy.cardText}</p>
            <button class="margin-link reveal-el" onclick="openDossier(${i})">Open dossier <svg viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6 2l4 4-4 4" stroke="currentColor" stroke-width="1.4"/></svg></button>
          </div>
          <div class="story-transition" style="--role-color:${roleColor}">${policy.transition}</div>`;
      }
      layer.appendChild(cardEl);
      tlCards[i] = cardEl;
      cardEl._pulseRing = pulseRingNodes[i];
    });

    // Node's screen radius + a small gap — used on mobile to seat the card just
    // beneath the node rather than centred over it (where it would cover the ship).
    const nodeGapPx = nodeRadius * ctm.d + 14;
    const tops = tlCards.map((cardEl, i) => {
      const baseY = ctm.d * policyPoints[i].y + ctm.f;
      if (isMobileTimeline) {
        // Card top sits just below the node; the ship (locked to screen-centre)
        // stays visible above it as the reader arrives at each policy.
        return baseY + nodeGapPx;
      }
      const box = cardEl.querySelector('.card-box');
      const boxCenter = box.offsetTop + box.offsetHeight / 2;
      return baseY - boxCenter;
    });
    tlCards.forEach((cardEl, i) => { cardEl.style.top = tops[i] + 'px'; });
  }

  // ── ERA WORLD PANELS ─────────────────────────────────────────────────
  // Same idea as before, simpler execution: one saturated color drifts across
  // the six eras (40°→200°, warm brass to slate blue) as the panel's own
  // background — no separate banner section, no layout change — with the
  // image treatment (sepia/opacity) drifting alongside it.
  function eraBannerColor(t) {
    const hue = 40 + t * 160;
    return `hsl(${hue.toFixed(0)}, 58%, 31%)`;   // verified 5:1+ white-text contrast across the drift
  }
  // Duotone (via #tl-era-duotone SVG filter below) keeps the engraving's own
  // shadow/highlight contrast instead of washing it toward one flat hue —
  // a straight grayscale+sepia+low-opacity mix reads as mud, not an image.
  function eraImageTreatment(t) {
    return {
      opacity: (0.78 + t * 0.14).toFixed(2)
    };
  }

  if (!document.getElementById('tl-era-duotone')) {
    const svgDefs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svgDefs.setAttribute('width', '0');
    svgDefs.setAttribute('height', '0');
    svgDefs.style.position = 'absolute';
    svgDefs.innerHTML = `
      <filter id="tl-era-duotone">
        <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 1 0"/>
        <feComponentTransfer>
          <feFuncR type="table" tableValues="0.10 0.83"/>
          <feFuncG type="table" tableValues="0.07 0.65"/>
          <feFuncB type="table" tableValues="0.04 0.45"/>
        </feComponentTransfer>
      </filter>`;
    document.body.appendChild(svgDefs);
  }

  if (ctm) {
    tlEraScaleY = ctm.d;
    const worldLayer = document.createElement('div');
    worldLayer.id = 'era-world-layer';
    document.body.appendChild(worldLayer);
    tlEraWorldLayer = worldLayer;

    gapAnchors.forEach(anchor => {
      const era       = eras[anchor.eraIndex];
      const top       = ctm.d * anchor.topY + ctm.f;
      const height    = ctm.d * (anchor.bottomY - anchor.topY);
      const imgSrc    = era.image;
      const dateRange = era.dateRange || '';
      const t         = eras.length > 1 ? anchor.eraIndex / (eras.length - 1) : 0;
      const banner    = eraBannerColor(t);
      const img       = eraImageTreatment(t);

      const panel = document.createElement('div');
      panel.className = `era-panel ${era.periodClass || ''}`.trim();
      panel.style.cssText = `top:${top}px;height:${height}px;--era-banner:${banner};`;
      panel.innerHTML = `
        <div class="era-panel-content">
          <div class="era-panel-content-inner">
            <span class="era-cover-eyebrow">Era ${anchor.eraIndex + 1} · ${dateRange}</span>
            <h2 class="era-cover-title">${era.title}</h2>
            <div class="era-text-body">${era.narrative}</div>
          </div>
        </div>
        <div class="era-panel-image">
          ${imgSrc ? `<div class="era-cover-bg" style="background-image:url('${imgSrc}');filter:url(#tl-era-duotone) contrast(1.05);opacity:${img.opacity};"></div>` : ''}
          ${era.caption ? `<span class="era-image-caption">${era.caption}</span>` : ''}
        </div>`;
      worldLayer.appendChild(panel);
    });
  }

  // ── CLOSING TEXT ─────────────────────────────────────────────────────
  // No separate scene/graphic here anymore — the ending is the river itself
  // widening into the sea (drawn in drawRiver/seaSamples above). This is just
  // a transparent text overlay that fades in on top of that canvas scene.
  {
    const recap = document.createElement('div');
    recap.id = 'tl-recap';

    const textWrap = document.createElement('div');
    textWrap.className = 'tl-recap-text';
    textWrap.innerHTML = `
      <p class="tl-recap-eyebrow">Four centuries · ${policies.length} narrative scenes</p>
      <p class="tl-recap-line tl-recap-line-1">There was never just one gate.</p>
      <p class="tl-recap-line tl-recap-line-2">Different boundaries move in different ways.</p>`;

    recap.appendChild(textWrap);
    document.body.appendChild(recap);
    tlRecapLayer = recap;
    recapEyebrow = textWrap.querySelector('.tl-recap-eyebrow');
    recapLine1 = textWrap.querySelector('.tl-recap-line-1');
    recapLine2 = textWrap.querySelector('.tl-recap-line-2');
  }

  tlVizWrapper = document.querySelector('.tl-viz-wrapper');

  if (!tlProgressTrack) {
    tlProgressTrack = document.createElement('div');
    tlProgressTrack.className = 'tl-progress-track';
    tlProgressTrack.style.opacity = '0';
    tlProgressFill = document.createElement('div');
    tlProgressFill.className = 'tl-progress-fill';
    tlProgressTrack.appendChild(tlProgressFill);
    document.body.appendChild(tlProgressTrack);
  }

  // ── THE MASTER GSAP TIMELINE ─────────────────────────────────────────
  if (tlMasterTl) { tlMasterTl.kill(); tlMasterTl = null; }
  tlMasterTl = gsap.timeline({ paused: true, onUpdate: applyFrame });

  // The node-follow segments (unchanged shape) sum to nodesDur; the outro/hold
  // are sized off that, exactly as before.
  const nodesDur = segLen.reduce((a, b) => a + b, 0);
  outroDur = Math.max(1, nodesDur * 0.12);
  const holdDur = Math.max(1, nodesDur * 0.18);

  // Hero lead-in: nav.frac 0 (top of hero tail) → f_seam (old timeline start).
  // Its duration is set so the hero occupies the SAME share of the master
  // timeline as the hero section occupies of the total scrollable height — so
  // the seam is reached exactly when the hero scrolls away (no dead-air gap,
  // no arc-length mismatch). Read the real heights so it self-corrects if the
  // CSS min-heights change.
  const introH = document.querySelector('.tl-intro-section').offsetHeight;
  const containerH = containerEl.offsetHeight;
  const HERO_SCROLL_FRAC = introH / (introH + containerH);
  const restDur = nodesDur + outroDur + holdDur;
  const heroLeadDur = restDur * HERO_SCROLL_FRAC / (1 - HERO_SCROLL_FRAC);
  tlMasterTl.to(nav, { frac: f_seam, duration: heroLeadDur, ease: 'none' });

  for (let i = 0; i < points.length - 1; i++) {
    const touchesGap = points[i].isGap || points[i + 1].isGap;
    tlMasterTl.to(nav, {
      frac: nodeFrac[i + 1],
      duration: segLen[i],
      ease: touchesGap ? 'none' : 'power1.inOut'
    });
  }

  T_FOLLOW_END = tlMasterTl.duration();   // = heroLeadDur + nodesDur (ship at last node)
  tlMasterTl.to({ _outro: 0 }, { _outro: 1, duration: outroDur, ease: 'none' });

  // Dwell: hold on the finished sea+text frame for a stretch of scroll before
  // the pin releases. Without this, the container's bottom lands at exactly
  // outroT===1 (scrub maps scroll 1:1 onto timeline time), so is-active flips
  // off — and the fixed viz layer disappears — the instant the ending frame
  // is complete, flashing straight to the plain page background beneath it.
  tlMasterTl.to({}, { duration: holdDur });

  // ── THE SINGLE SCROLL SYSTEM ─────────────────────────────────────────
  if (tlScrollTrigger) { tlScrollTrigger.kill(); tlScrollTrigger = null; }
  tlScrollTrigger = ScrollTrigger.create({
    trigger: tlSectionEl,        // #policy-history — spans hero + timeline container
    start: 'top top',
    end: 'bottom bottom',
    scrub: 1.2,
    animation: tlMasterTl,
    onToggle: self => {
      // Nothing follows this section in the document. If we're deactivating
      // because scroll reached the bottom (progress ~1), don't hide or reset
      // anything — that would just tear down the sea+text and expose the
      // bare page underneath, which is exactly what shouldn't happen since
      // there's nowhere further to go. Only reset when exiting back out the
      // TOP (progress ~0) — i.e. scrolling back up above the section.
      if (!self.isActive && self.progress >= 0.999) {
        return;
      }
      tlSectionActive = self.isActive;
      tlSectionEl.classList.toggle('is-active', self.isActive);
      if (tlProgressTrack) tlProgressTrack.style.opacity = self.isActive ? '1' : '0';
      if (!self.isActive) {
        eraCurrentIndex = -1;
        document.body.style.backgroundColor = '';
        if (tlEraWorldLayer) tlEraWorldLayer.style.visibility = 'hidden';
        // The closing text overlay lives outside .tl-viz-wrapper (it's fixed
        // to the viewport, above everything), so it isn't covered by the
        // is-active CSS opacity toggle above — without this it stays parked
        // at full opacity, floating on the bare page once the pin releases.
        recapEngaged = false;
        if (tlRecapLayer) tlRecapLayer.style.opacity = '0';
        if (recapEyebrow) recapEyebrow.style.opacity = '0';
        if (recapLine1)   recapLine1.style.opacity   = '0';
        if (recapLine2)   recapLine2.style.opacity   = '0';
      }
    }
  });

  tlSectionActive = tlScrollTrigger.isActive;
  tlSectionEl.classList.toggle('is-active', tlScrollTrigger.isActive);
  applyFrame();
}

// Entrance animation for the intro section
window.addEventListener('DOMContentLoaded', () => {
  const introInner = document.querySelector('.tl-intro-inner');
  const introSection = document.querySelector('.tl-intro-section');
  if (introInner && introSection) {
    const observer = new IntersectionObserver(
      entries => { if (entries[0].isIntersecting) introInner.classList.add('is-visible'); },
      { threshold: 0.3 }
    );
    observer.observe(introSection);
  }
});

// Full teardown + reinit. Every one-time layout measurement (era-gap heights,
// card vertical centering) is captured inside initPolicyTimeline(), so anything
// that changes those metrics — a resize, OR the web fonts finishing loading —
// must run this to recapture them. Otherwise the measurements keep fallback-font
// values and cards drift off their nodes / era gaps are mis-sized.
function reinitPolicyTimeline() {
  const svgEl = document.getElementById('timeline-viz');
  if (svgEl) svgEl.innerHTML = '';
  resizeRiverCanvas();
  clearTimelineOverlays();
  if (tlScrollTrigger) { tlScrollTrigger.kill(); tlScrollTrigger = null; }
  if (tlMasterTl) { tlMasterTl.kill(); tlMasterTl = null; }
  tlInitialized = false;
  initPolicyTimeline();
  if (window.ScrollTrigger) ScrollTrigger.refresh();
}

// Initialize on load — reset scroll first so browser restoration doesn't start mid-timeline.
window.addEventListener('DOMContentLoaded', () => {
  if (window.gsap && window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger, MotionPathPlugin, SplitText);
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  window.scrollTo(0, 0);
  initPolicyTimeline();

  // The first init runs at DOMContentLoaded, before Crimson Text / Lora have
  // loaded — so the measurements above use fallback-font metrics. Recapture them
  // once the real fonts swap in. Guarded so a font set that's already cached
  // (ready resolves immediately) doesn't reinit needlessly on top of a good init.
  if (document.fonts && document.fonts.ready) {
    const swapReinit = () => { if (tlInitialized) reinitPolicyTimeline(); };
    if (document.fonts.status === 'loaded') { /* already correct — no reinit */ }
    else document.fonts.ready.then(swapReinit);
  }
});

// Reinitialize on resize so mobile/desktop layout constants stay correct.
let tlResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(tlResizeTimer);
  tlResizeTimer = setTimeout(reinitPolicyTimeline, 250);
});

// bird.mp4's background isn't real alpha, and drawing it to a <canvas> for
// per-pixel keying throws a SecurityError under file:// (canvas tainted by
// cross-origin data) — this project is normally opened directly from disk.
// Pre-baked transparent PNG frames (images/bird-frames/, extracted via
// ffmpeg's lumakey filter) sidestep that entirely: plain <img> swaps, no
// canvas, no video, no taint risk.
const HERO_BIRD_FRAME_COUNT = 80;
window.addEventListener('DOMContentLoaded', () => {
  // Respect reduced-motion: the CSS above already hides the birds; skip the
  // frame-swap interval too so we neither animate nor fetch 80 frames per bird.
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const birds = document.querySelectorAll('.hero-bird-frame');
  const heroSky = document.querySelector('.hero-sky');
  if (!birds.length) return;

  const frames = Array.from(birds, (_, i) => i * 11); // offset each bird so they don't flap in sync
  let birdTimer = null;
  const startBirds = () => {
    if (birdTimer) return;
    birdTimer = setInterval(() => {
      birds.forEach((img, i) => {
        frames[i] = (frames[i] + 1) % HERO_BIRD_FRAME_COUNT;
        img.src = `images/bird-frames/f${String(frames[i] + 1).padStart(3, '0')}.png`;
      });
    }, 1000 / 8);
  };
  const stopBirds = () => { if (birdTimer) { clearInterval(birdTimer); birdTimer = null; } };

  // Only run the frame-swap while the hero is actually on screen — once it has
  // scrolled away there's nothing to animate, so the timer (and its per-frame
  // image swaps) is pure waste. Fall back to always-on if there's no sky/observer.
  if (heroSky && 'IntersectionObserver' in window) {
    new IntersectionObserver(entries => {
      if (entries[0].isIntersecting) startBirds(); else stopBirds();
    }).observe(heroSky);
  } else {
    startBirds();
  }
});


</script>
</body>
</html>
