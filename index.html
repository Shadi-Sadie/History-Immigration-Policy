<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From the Word to the Law</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;1,400&family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --ink:       #24211d;
  --ink-mid:   #5f5a52;
  --ink-soft:  #8d867b;
  --ink-faint: #d8cfbf;

  --paper:     #f7f3eb;
  --paper-mid: #eee7dc;
  --rule:      #d8cfbf;

  --brass:     #a8843a;
  --blue:      #56718a;
  --red:       #a35e50;
  --green:     #5f7e67;
  --river:      #568b98;
  --sea:        #568b98;
  --serif: 'Lora', Georgia, serif;
  --body:  'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;

}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* Native smooth-scroll is OFF: GSAP ScrollTrigger reads the real scroll position. */
html{scroll-behavior:auto;overscroll-behavior:none;height:100%;}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;font-weight:400;line-height:1.6;min-height:100vh;transition:background-color 0.9s ease;overscroll-behavior:none;}
.page{max-width:620px;margin:0 auto;padding:0 1.25rem;}

.policy-history-section {
  position: relative;
  background: linear-gradient(var(--paper) 0%, var(--paper-mid) 100%);
  color: var(--ink);
}

.tl-intro-section {
  position: relative;
  min-height: 118vh;
  text-align: center;
  z-index: 2;
  /* Transparent so the single fixed river canvas (in .tl-viz-wrapper, z-index 1)
     shows through the hero. The hero's own text (z-index 3), map/clouds
     (z-index 1–2 inside this stacking context) still layer above the river. */
  background: transparent;
  color: var(--ink);
  font-family: 'Crimson Text', serif;
  overflow: visible;
}

.tl-intro-inner {
  /* Fixed (not in page flow) so it never moves with raw scroll. Its only motion
     comes from applyFrame, driven by the SAME camTy that draws the lake — so it
     rides the lake in perfect lockstep, with no independent movement. */
  position: fixed;
  top: 50%; left: 0; right: 0;
  z-index: 3;
  max-width: 880px;
  margin: 0 auto;
  padding: 0 1.25rem;
  text-align: center;
  pointer-events: none;
  opacity: 0;
  /* NB: no transform in the transition. applyFrame sets transform every frame to
     lock the block to the lake; a transform transition would make it lag ~0.9s
     behind the lake while scrolling (reads as independent drift). Entrance is a
     pure opacity fade instead. */
  transition: opacity 0.9s ease;
}

.tl-intro-inner.is-visible {
  opacity: 1;
}

.tl-intro-title {
  font-family: 'Crimson Text', serif;
  font-size: clamp(2.2rem, 6vw, 4.6rem);
  line-height: 1.12;
  margin-bottom: 0.5rem;
  color: var(--paper);
  font-weight: 600;
}

.tl-intro-subtitle {
  font-family: 'Crimson Text', serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(1.1rem, 2.6vw, 1.7rem);
  color: var(--paper-mid);
}

/* ── Hero: US map / river / ship intro (index.html-only, independent of the
   pinned #policy-history timeline engine below — see CLAUDE.md) ────────── */

.hero-sky {
  position: absolute;
  inset: 0;
  z-index: 1;
  overflow: hidden;
  pointer-events: none;
}

.hero-cloud {
  position: absolute;
  width: clamp(140px, 22vw, 260px);
  opacity: 0.35;
  filter: blur(0.5px);
  will-change: transform;
}

@keyframes heroCloudDrift {
  from { transform: translateX(-20vw); }
  to   { transform: translateX(120vw); }
}

.hero-cloud-1 { top: calc(8vh - 1in);  opacity: 0.3;  animation: heroCloudDrift 70s linear infinite; }
.hero-cloud-2 { top: calc(6vh - 1in); opacity: 0.22; animation: heroCloudDrift 95s linear infinite -30s; }
.hero-cloud-3 { top: calc(4vh - 1in);  opacity: 0.18; animation: heroCloudDrift 120s linear infinite -60s; }

.hero-bird {
  position: absolute;
  width: 70px;
  height: 40px;
  will-change: transform;
}

.hero-bird-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
}

@keyframes heroBirdDrift1 {
  0%   { transform: translate(-15vw, 20vh) scale(0.8); }
  50%  { transform: translate(55vw, 10vh) scale(0.8); }
  100% { transform: translate(120vw, 22vh) scale(0.8); }
}

@keyframes heroBirdDrift2 {
  0%   { transform: translate(-10vw, 14vh) scale(0.55); }
  50%  { transform: translate(60vw, 24vh) scale(0.55); }
  100% { transform: translate(130vw, 12vh) scale(0.55); }
}

.hero-bird-1 { animation: heroBirdDrift1 55s ease-in-out infinite; }
.hero-bird-2 { animation: heroBirdDrift2 70s ease-in-out infinite -20s; }

/* The US-shaped lake, the river, and the boat are all drawn on the single fixed
   #river-canvas by the timeline engine (see drawRiver / drawLake / .tl-ship).
   The lake is the head of the current: it lives in the same world space as the
   river band, so it flows away upward as the camera follows the ship downstream.
   No hero SVG map/river/ship element exists any more. */

.tl-timeline-container {
  position: relative;
  min-height: 1650vh;
  background: linear-gradient(180deg, var(--paper) 0%, var(--paper-mid) 100%);
}

.tl-viz-wrapper {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100vh;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 1;              /* visible from load — the single river shows through the hero */
  pointer-events: none;
}

.policy-history-section.is-active .tl-viz-wrapper {
  pointer-events: auto;
}

/* Canvas river — flat blue water band behind the SVG path. */
.tl-river {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#timeline-viz {
  position: relative;
  z-index: 1;
  width: 100%;
  height: 100%;
  
}

/* Hide the SVG path graphics — keep them only for GSAP/path measurements */
.tl-bg-path,
.tl-overview-bg,
.tl-seg-path,
.tl-anim-path {
  opacity: 0;
}
/* completion state — all policies traversed */
@keyframes completionPulse {
  0%,100% { opacity: 0.7; }
  50%      { opacity: 1; }
}
.tl-viz-wrapper.tl-complete #timeline-viz {
  animation: completionPulse 2.4s ease-in-out infinite;
}

/* policy cards — appended to body during timeline */
.policy-item {
  position: fixed;
  z-index: 100;
  transform: translateY(-50%);
  opacity: 0;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
}

.policy-item.active {
  opacity: 1;
  pointer-events: auto;
}

/* Cards are revealed via the data-shown flag (see applyFrame), not the
   .active class — so re-enable interaction here, keyed to that flag, or the
   card layer's pointer-events:none leaves the "Open policy file" button dead. */
.policy-item[data-shown="1"] {
  pointer-events: auto;
}

.policy-item.left {
  left: 3%;
  
}

.policy-item.right {
  /* left/top set by JS from SVG anchor coordinates */

}

@keyframes fadeInCard {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}


/* ============================================================
   CARD TREATMENT 1 — MARGINAL ANNOTATION (regular narrative scenes)
   No box, no border, no shadow — text floats beside the river.
   ============================================================ */
.margin-card {
  position: relative;
  width: 100%;
  max-width: 380px;
  padding-left: 1.1rem;
  border-left: 1px solid var(--ink-faint);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink);
}
.margin-card::before {
  content: '';
  position: absolute; left: -1px; top: .4rem;
  width: 1px; height: 14px;
  background: var(--role-color, var(--brass));
}
.margin-year {
  font-family: 'Space Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.1em;
  color: var(--role-color, var(--brass));
  margin-bottom: 0.35rem;
  display: block;
  font-weight: 700;
}
.margin-title {
  font-family: 'Crimson Text', serif;
  font-weight: 600;
  font-size: 1.25rem;
  color: var(--ink);
  line-height: 1.25;
  margin-bottom: 0.5rem;
}
.margin-type {
  display: inline-block;
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 0.6rem;
}
.margin-summary {
  font-size: 0.9rem;
  color: var(--ink-mid);
  line-height: 1.55;
  margin-bottom: 0.1rem;
}
.margin-link {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.66rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--ink-soft); text-decoration: none; margin-top: 0.75rem;
  cursor: pointer; background: none; border: none; padding: 0; font-weight: 500;
  transition: color .2s ease;
}
.margin-link:hover, .margin-link:focus-visible { color: var(--brass); }
.margin-link svg { width: 9px; height: 9px; }

/* ============================================================
   CARD TREATMENT 2 — LANDMARK / TORN DOCUMENT (selected system nodes)
   Aged paper fragment, deckle top edge, statutory pull-quote.
   ============================================================ */
.landmark-card {
  position: relative;
  width: 100%;
  max-width: 460px;
  background: #efe6d2;
  padding: 2.3rem 2rem 1.9rem;
  box-shadow: 0 22px 50px rgba(36,33,29,0.28);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  color: var(--ink);
  clip-path: polygon(
    0% 2%, 4% 0%, 9% 2.5%, 14% 0%, 19% 2%, 24% 0.5%, 29% 2.3%, 34% 0%,
    39% 1.8%, 44% 0.3%, 49% 2.4%, 54% 0%, 59% 1.6%, 64% 0.4%, 69% 2.2%,
    74% 0%, 79% 1.9%, 84% 0.2%, 89% 2.5%, 94% 0%, 100% 2%,
    100% 100%, 0% 100%
  );
}
.landmark-card::after {
  content: '';
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    repeating-linear-gradient(90deg, rgba(36,33,29,0.015) 0px, transparent 1px, transparent 2px),
    repeating-linear-gradient(0deg, rgba(36,33,29,0.015) 0px, transparent 1px, transparent 2px);
}
.landmark-stamp {
  position: absolute; top: 1.1rem; right: 1.3rem;
  width: 50px; height: 50px; border-radius: 50%;
  border: 2px solid var(--brass); color: var(--brass);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Space Mono', monospace; font-size: 0.58rem; letter-spacing: 0.02em;
  text-align: center; transform: rotate(-8deg); opacity: 0.85; line-height: 1.1;
}
.landmark-eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 0.64rem; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--brass); margin-bottom: 0.85rem;
}
.landmark-title {
  font-family: 'Crimson Text', serif;
  font-weight: 600; font-size: 1.55rem;
  color: var(--ink); line-height: 1.2; margin-bottom: 1rem; max-width: 78%;
}
.landmark-quote {
  font-family: 'Crimson Text', serif; font-style: italic; font-size: 1rem;
  color: var(--ink-mid); line-height: 1.55;
  border-left: 2px solid var(--brass);
  padding-left: 0.9rem; margin-bottom: 1.1rem;
}
.landmark-quote::before { content: '\201C'; }
.landmark-quote::after  { content: '\201D'; }
.landmark-summary {
  font-size: 0.88rem; color: var(--ink-mid); line-height: 1.6;
  margin-bottom: 1rem;
}
.landmark-link {
  display: inline-flex; align-items: center; gap: 0.4rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink); text-decoration: none; font-weight: 600;
  border: none; border-bottom: 1px solid var(--brass); padding: 0 0 0.15rem;
  background: none; cursor: pointer;
}
.landmark-link:hover { color: var(--brass); }
.landmark-link svg { width: 10px; height: 10px; }

/* Archival photo + credit, above either card treatment. The <figure> owns the
   spacing so image and caption reveal and pan as a single block. */
.policy-figure {
  width: 100%;
  max-width: 360px;
  margin: 0 0 0.9rem;
}
.policy-figure-landmark { max-width: 460px; }
.policy-photo {
  width: 100%;
  border: 2px solid rgba(168,132,58,0.4);
  border-radius: 8px;
  box-shadow: 0 12px 32px rgba(0,0,0,0.18);
  display: block;
  aspect-ratio: 4/3;
  object-fit: cover;
  object-position: center top;
  /* Unify 19th-c. lithographs, newsprint scans, and mid-century photography
     into one warm, aged register that matches the paper theme. */
  filter: sepia(0.32) contrast(1.03) brightness(0.99);
}
.policy-caption {
  margin-top: 0.5rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  line-height: 1.45;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
}


.story-anchor {
  font-family: 'Crimson Text', serif;
  font-style: italic;
  font-size: 0.93rem;
  color: var(--ink-soft);
  line-height: 1.35;
  margin: -0.15rem 0 0.6rem;
}
.story-role {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  font-family: 'Space Mono', monospace;
  font-size: .58rem;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--role-color, var(--brass));
  margin-bottom: .45rem;
}
.story-role::before { content:''; width:6px; height:6px; border-radius:50%; background:currentColor; }
.story-transition {
  max-width: 390px;
  margin-top: .25rem;
  padding: .7rem .9rem .75rem;
  border-top: 1px dashed var(--rule);
  font-family: 'Crimson Text', serif;
  font-style: italic;
  font-size: .95rem;
  line-height: 1.42;
  color: var(--ink-mid);
  background: rgba(247,243,235,.84);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity .25s ease, transform .25s ease;
  pointer-events: none;
}
.story-transition.is-visible { opacity: .92; transform: translateY(0); }
.story-transition::before { content:'Next — '; font-family:'Space Mono',monospace; font-style:normal; font-size:.58rem; text-transform:uppercase; letter-spacing:.08em; color:var(--role-color,var(--brass)); }
.landmark-anchor { font-family:'Crimson Text',serif; font-style:italic; color:var(--ink-mid); font-size:.95rem; margin:-.35rem 0 .75rem; max-width:85%; }

/* richer narrative dossier */
.dossier-anchor { font-family:'Crimson Text',serif; font-style:italic; color:var(--ink-mid); font-size:1.08rem; margin:-.7rem 0 1.25rem; }
.dossier-story { background:#efe7d9; border-left:3px solid var(--role-accent, var(--brass)); padding:1.1rem 1.2rem; }
.dossier-story h3 { font-family:'Crimson Text',serif; font-size:1.35rem; line-height:1.2; margin:0 0 .45rem; }
.dossier-bullets { padding-left:1.2rem; color:var(--ink-mid); }
.dossier-bullets li { margin:.42rem 0; line-height:1.5; }
.dossier-callbacks { display:flex; flex-wrap:wrap; gap:.45rem; }
.dossier-callbacks span { font-family:'Space Mono',monospace; font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; padding:.28rem .45rem; border:1px solid var(--rule); border-radius:999px; color:var(--ink-mid); background:rgba(168,132,58,.05); }
.dossier-link-note { font-size:.78rem; color:var(--ink-soft); margin:.2rem 0 0; line-height:1.4; }

/* ============================================================
   POLICY DOSSIER — archival file modal, opened from either card
   ============================================================ */
.dossier-overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(20,18,14,0.72);
  display: none; align-items: flex-start; justify-content: center;
  padding: 5vh 1.25rem; overflow-y: auto;
}
.dossier-overlay.is-open { display: flex; }
.dossier {
  width: 100%; max-width: 720px;
  background: var(--paper);
  border: 1px solid var(--rule);
  box-shadow: 0 30px 70px rgba(0,0,0,0.4);
  padding: 3rem 3rem 2.5rem;
  position: relative;
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
}
.dossier-close {
  position: absolute; top: 1.4rem; right: 1.6rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
  background: none; border: 1px solid var(--ink-faint); color: var(--ink-mid);
  padding: 0.4rem 0.7rem; cursor: pointer; border-radius: 2px;
}
.dossier-close:hover { border-color: var(--brass); color: var(--brass); }
.dossier-rule { border: none; border-top: 1px dashed var(--rule); margin: 1.6rem 0; }
.dossier-filecode {
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--role-accent, var(--brass)); margin-bottom: 0.6rem;
}
.dossier-title {
  font-family: 'Crimson Text', serif; font-weight: 600;
  font-size: clamp(1.6rem, 4vw, 2.1rem);
  color: var(--ink); line-height: 1.2; margin-bottom: 1.2rem;
}
.dossier-photo {
  display: block; width: auto; height: auto; max-width: 100%; max-height: 340px;
  margin: 0 0 0.6rem;
  filter: sepia(0.32) contrast(1.03) brightness(0.99);
}
.dossier-photo-caption {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem; line-height: 1.5; letter-spacing: 0.02em;
  color: var(--ink-soft); margin: 0 0 1.3rem;
}
.dossier-meta {
  display: grid; grid-template-columns: repeat(2,1fr); gap: 0.6rem 2rem;
  font-size: 0.85rem; color: var(--ink-mid); margin-bottom: 0.5rem;
}
.dossier-meta dt {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-soft); margin-bottom: 0.15rem;
}
.dossier-meta dd { color: var(--ink); font-weight: 500; }
.dossier-section { margin-bottom: 1.5rem; }
.dossier-h {
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--role-accent, var(--brass)); margin-bottom: 0.5rem;
}
.dossier-body p { font-size: 0.96rem; color: var(--ink-mid); line-height: 1.7; margin-bottom: 0.6rem; }
.dossier-quote {
  font-family: 'Crimson Text', serif; font-style: italic; font-size: 1.15rem; color: var(--ink);
  border-left: 2px solid var(--role-accent, var(--brass)); padding-left: 1rem; line-height: 1.5;
}
.dossier-inout { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.dossier-inout div { font-size: 0.9rem; color: var(--ink-mid); line-height: 1.6; }
.dossier-inout .dossier-h { margin-bottom: 0.35rem; }
.dossier-links { list-style: none; }
.dossier-links li {
  font-size: 0.88rem; padding: 0.5rem 0; border-bottom: 1px solid var(--rule);
  display: flex; justify-content: space-between; gap: 1rem; color: var(--ink-mid);
}
.dossier-links li a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--brass); }
.dossier-links li a:hover { color: var(--brass); }
.dossier-links li span.tag {
  font-family: 'Space Mono', monospace;
  font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--ink-soft); white-space: nowrap;
}
.dossier-return {
  display: inline-block; margin-top: 1rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--ink-mid); text-decoration: none; cursor: pointer; background: none; border: none;
}
.dossier-return:hover { color: var(--brass); }
.dossier-top { margin-bottom: 1.5rem; padding-right: 4.5rem; }
.dossier-newtab {
  display: inline-flex; align-items: center; gap: 0.45rem;
  font-family: 'Space Mono', monospace;
  font-size: 0.72rem; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--brass); text-decoration: none; cursor: pointer;
  background: none; border: 1px solid var(--brass); border-radius: 2px;
  padding: 0.45rem 0.8rem; transition: background-color .2s ease, color .2s ease;
}
.dossier-newtab:hover { background: var(--brass); color: var(--paper); }
.dossier-newtab svg { width: 11px; height: 11px; }
.dossier-empty-note {
  font-size: 0.85rem; color: var(--ink-soft); font-style: italic; padding: 1rem;
  background: rgba(168,132,58,0.07); border-radius: 3px;
}
.dossier-tabs {
  display: flex; gap: 1.6rem; border-bottom: 1px solid var(--rule);
  margin: 1.5rem 0 1.6rem; overflow-x: auto;
}
.dossier-tabs button {
  border: 0; background: none; padding: .5rem 0; margin: 0; cursor: pointer;
  font-family: 'Space Mono', monospace; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--ink-soft); border-bottom: 2px solid transparent; white-space: nowrap;
}
.dossier-tabs button:hover { color: var(--ink); }
.dossier-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--role-accent, var(--brass)); }
.dossier-panel[hidden] { display: none; }
.dossier-person { display: grid; grid-template-columns: 34px 1fr; gap: .9rem; padding: 1.1rem 0; border-top: 1px solid var(--rule); }
.dossier-person:first-of-type { border-top: 1px solid var(--rule); }
.dossier-person-num { font-family: 'Crimson Text', serif; font-size: 1.5rem; color: var(--ink-faint); line-height: 1; }
.dossier-person-role {
  font-family: 'Space Mono', monospace; font-size: .6rem; letter-spacing: .08em; text-transform: uppercase;
  color: var(--role-accent, var(--brass)); margin-bottom: .3rem;
}
.dossier-person h3 { font-family: 'Crimson Text', serif; font-size: 1.1rem; font-weight: 600; margin: 0 0 .5rem; color: var(--ink); }
.dossier-person-link { font-size: .8rem; color: var(--role-accent, var(--brass)); text-underline-offset: 3px; display: inline-block; margin-top: .2rem; }
@media(max-width:640px) {
  .dossier { padding: 2.2rem 1.4rem 2rem; }
  .dossier-meta, .dossier-inout { grid-template-columns: 1fr; }
  .dossier-tabs { gap: 1.1rem; }
}

@media(max-width:768px) {
  .tl-intro-title { font-size: clamp(1.8rem, 8vw, 2.6rem); }
  .tl-intro-hint { margin-top: 2rem; }
  /* Scroll budget must track the path length. The phone path is now sized from
     a target on-screen node gap (NODE_SPACING_PX), so it is much longer in
     screen pixels than it used to be; at 1100vh the camera panned 2.5 screen-px
     per scroll-px, vs desktop's 1.66. 1700vh restores desktop's pacing. */
  .tl-timeline-container { min-height: 2450vh; }
  .margin-card,.landmark-card,.policy-figure,.policy-figure-landmark { max-width: 90vw; }
  .policy-item.left  { left: 2%; }
  /* .right position set by JS on tablet — keep right fallback only on small screens */
  .tl-viz-wrapper { width: 100%; height: 100vh; }
  /* Era-panel phone rules are NOT here — they live in their own
     @media(max-width:768px) block placed *after* the era base rules below,
     because those base rules have identical specificity and would otherwise
     win on source order. Don't move them back up here. */
}

/* 768, not 640: the JS switches to centred, head-to-toe card placement at
   `isMobileTimeline` = max-width 768px, so the height caps that keep those
   cards from colliding have to start at the same breakpoint. At 640 the
   641-768px band (tablets) got centred cards with no cap — measured 708px
   items against a 480px slot. */
@media(max-width:768px) {
  /* Phone card placement is handled in JS (centred horizontally, dropped just
     below the node) so it pans with the river trail. The old bottom-dock rule
     that used to live here couldn't work — a `bottom`-anchored card still pans
     away with the card layer's per-frame translateY — so it's gone. These rules
     just cap the card/photo size so a tall card stays inside the viewport. */
  /* Phone cards are centred under their node and stack head-to-toe, so an
     item's total height has to fit inside NODE_SPACING_PX (480px). Photo +
     card + caption is capped here to ~470px; keep these in sync with
     NODE_SPACING_PX or neighbouring cards start overlapping again. */
  .margin-card, .landmark-card {
    /* Hard px ceiling as well as the vh one: NODE_SPACING_PX is a fixed 480px,
       so on a tall phone/tablet a purely vh-based cap grows past its slot and
       the cards collide again (measured 708px items at 768x1024). */
    max-height: min(31vh, 262px);
    overflow: auto;
    padding: 1.1rem 1rem 1rem;
  }
  /* On mobile the card sits centred under its node (no side margin to float
     in like on desktop), so it lands directly on the river/ship art as it
     pans past. Without a background here, text reads straight against the
     moving teal river underneath it. */
  .margin-card {
    background: rgba(247,243,235,0.95);
    border-radius: 3px;
    box-shadow: 0 8px 24px rgba(36,33,29,0.16);
  }
  /* Same problem as the card: the caption below the photo is plain text with
     no background, and the figure sits centred over the river like the card
     does, so it reads straight against the river underneath. Wrap the whole
     figure in the same paper plate rather than backing the caption alone —
     keeps photo + credit reading as one block. */
  .policy-figure, .policy-figure-landmark {
    max-width: 90vw;
    margin-bottom: 0.5rem;
    background: rgba(247,243,235,0.95);
    border-radius: 3px;
    box-shadow: 0 8px 24px rgba(36,33,29,0.16);
    padding: 0.6rem 0.6rem 0.5rem;
  }
  .policy-photo { max-height: min(16vh, 135px); }
  .policy-caption { font-size: 0.55rem; margin-top: 0.35rem; }
}

/* ── ERA WORLD PANELS ────────────────────────────────────────────────── */
/* Each era boundary is a tall, opaque slab parked in world coordinates    */
/* inside a gap stretch of the river. The world layer pans with the camera */
/* (same model as the card trail); the slab fully occludes the river/ship  */
/* as it scrolls through. Cover half (1 viewport) sits above the text half.*/
#era-world-layer {
  position: fixed;
  inset: 0;
  /* Above cards (z100) as well as river/ship (z1): a still-visible card from
     the era just left behind can still be on-screen (not yet panned above the
     viewport) when this panel's opaque slab starts covering the same band —
     seen on mobile, where per-node spacing leaves less scroll runway before
     an era gap than desktop. The panel is meant to fully occlude the scene
     it scrolls through, cards included, so it must render above them. */
  z-index: 150;            /* above river/ship (z1) and cards (z100); below recap (z200) */
  pointer-events: none;
  transform-origin: 0 0;
  will-change: transform;
  visibility: hidden;      /* shown only during the follow phase (applyFrame) */
}
.era-panel {
  position: absolute;
  left: 0;
  width: 100vw;
  display: flex;
  flex-direction: row;
  overflow: hidden;
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  background: var(--era-banner, var(--paper));
}
/* Era 1 is the very first thing the camera reaches after the hero scroll — a
   hard-edged banner arriving right there reads as "hero video ends, timeline
   video starts." Drop its top border and fade its top edge into the paper
   background instead, so it arrives as a continuation of the same shot. */
.era-panel.era-colonial {
  border-top: none;
  mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 12%);
}
.era-panel-image {
  position: relative;
  flex: 1 1 36%;
  max-width: 36%;
  overflow: hidden;
}
.era-image-caption {
  position: absolute;
  right: 0.75rem;
  bottom: 0.6rem;
  max-width: calc(100% - 1.5rem);
  font-family: 'Space Mono', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.03em;
  text-align: right;
  color: rgba(255,255,255,0.55);
  text-shadow: 0 1px 4px rgba(0,0,0,0.6);
}
.era-panel-content {
  position: relative;
  flex: 1 1 64%;
  max-width: 64%;
  display: flex;
  align-items: flex-start;
  overflow: hidden;
}
.era-panel-content-inner {
  width: 100%;
  max-width: 720px;
  padding: 5.5rem 3rem 3.5rem 4.5rem;
}
/* Slim scroll-progress indicator — replaces the old top-left "Era N of 6"
   text counter, which duplicated the in-panel eyebrow. Tracks position
   through the whole timeline section, not just era boundaries. */
.tl-progress-track {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  z-index: 300;
  background: rgba(0,0,0,0.12);
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.tl-progress-fill {
  height: 100%;
  width: 100%;
  transform: scaleX(0);
  transform-origin: left center;
  background: rgba(212,165,116,0.9);
  will-change: transform;
}
@keyframes pulseEntry {
  0%   { transform: scale(1);   filter: drop-shadow(0 0 12px rgba(192,161,58,0.6)); }
  35%  { transform: scale(1.7); filter: drop-shadow(0 0 30px rgba(192,161,58,1)); }
  70%  { transform: scale(1.2); filter: drop-shadow(0 0 18px rgba(192,161,58,0.8)); }
  100% { transform: scale(1);   filter: drop-shadow(0 0 20px rgba(192,161,58,0.9)); }
}
.pulse-entry { animation: pulseEntry 0.75s ease-out forwards; }

/* Era cover image — bleeds to the right edge, blends into the paper on its
   inner (left) edge so the panel reads as one continuous surface rather than
   a photo dropped onto a background. */
.era-cover-bg {
  position: absolute;
  inset: 0;
  background-size: cover;
  background-position: center;
  filter: url(#tl-era-duotone) contrast(1.05);
  opacity: 0.85;
  -webkit-mask-image: linear-gradient(to right, transparent 0%, black 38%);
  mask-image: linear-gradient(to right, transparent 0%, black 38%);
}
.era-cover-eyebrow {
  display: block;
  font-family: 'Space Mono', monospace;
  font-size: 0.68rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.8);
  margin-bottom: 0.9rem;
}
.era-cover-title {
  font-family: 'Crimson Text', serif;
  font-size: clamp(2rem, 3.4vw, 3rem);
  font-weight: 700;
  color: #fdfbf6;
  line-height: 1.15;
  margin-bottom: 0;
}

/* Era narrative text styles — flow directly under the title, no drop caps or
   separate held section; reads like a normal page of prose. */
.era-text-eyebrow {
  display: none; /* superseded by .era-cover-eyebrow above the title */
}
.era-narrative-heading {
  font-family: 'Crimson Text', serif;
  font-size: 1.2rem;
  font-weight: 700;
  color: #fdfbf6;
  line-height: 1.3;
  margin: 1.5rem 0 0.5rem;
}
.era-narrative-heading:first-child { margin-top: 0; }
.era-narrative-date {
  font-family: 'Space Mono', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.65);
  margin-bottom: 1.1rem;
}
.era-text-body {
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 1.18rem;
  line-height: 1.65;
  color: rgba(255,255,255,0.9);
}
.era-text-body p { margin-bottom: 1.1rem; }
.era-pull-line {
  font-family: 'Crimson Text', serif;
  font-style: italic;
  font-size: clamp(1.4rem, 2.2vw, 1.9rem);
  line-height: 1.3;
  color: #fdfbf6;
  margin: 1.4rem 0 0;
}

/* Phone era-panel layout. This block MUST stay after every .era-* base rule
   above: same specificity, so source order decides. Verified with
   getComputedStyle(.era-panel).flexDirection === 'column' at 390px. */
@media(max-width:768px) {
  .era-cover-title { font-size: 1.5rem; }
  .era-panel { flex-direction: column; }
  .era-panel-image { max-width: 100%; flex: 0 0 30vh; }
  .era-panel-content { max-width: 100%; }
  .era-panel-content-inner { padding: 1.75rem 1.5rem 2.5rem; max-width: 100%; }
  .era-cover-bg { opacity: 0.5; mask-image: linear-gradient(to bottom, black 55%, transparent 100%); -webkit-mask-image: linear-gradient(to bottom, black 55%, transparent 100%); }
}

/* ── CLOSING TEXT OVERLAY ─────────────────────────────────────────────── */
/* No graphic of its own — the ending is the river widening into the sea,   */
/* drawn on the canvas behind this (see drawRiver/seaSamples in the JS).    */
/* This is a transparent, screen-fixed text block that fades in over the   */
/* lower part of the frame, where the open water sits once the ship has    */
/* finished sailing in. Driven entirely by outroT in applyFrame.           */
#tl-recap {
  position: fixed;
  inset: 0;
  z-index: 200;            /* above cards (z100) / era panels (z60) / viz (z1) */
  display: flex;
  align-items: flex-end;   /* sit low, over the solid sea fill — not viewport-centered */
  justify-content: center;
  padding: 4rem 2rem 16vh;
  background: transparent;
  opacity: 0;
  pointer-events: none;
  will-change: opacity;
}
.tl-recap-text {
  text-align: center;
}
.tl-recap-eyebrow {
  font-family: 'Space Mono', monospace;
  font-size: 0.7rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(247,243,235,0.8);
  margin-bottom: 1.4rem;
  opacity: 0;
  text-shadow: 0 1px 8px rgba(0,0,0,0.45);
}
.tl-recap-line {
  font-family: 'Crimson Text', serif;
  font-size: clamp(1.7rem, 3.2vw, 3rem);
  line-height: 1.16;
  color: #f5f1e8;
  margin-bottom: 0.3rem;
  opacity: 0;
  text-shadow: 0 2px 14px rgba(0,0,0,0.5);
}
.tl-recap-line-2 { color: #e8c98f; font-style: italic; }
@media(max-width:768px) {
  #tl-recap { padding: 2.5rem 1.5rem 10vh; }
}

/* ── REDUCED MOTION ──────────────────────────────────────────────────────
   The scroll-scrubbed river/timeline is reader-driven (not autoplaying), so it
   stays. What we silence here is the *ambient, involuntary* motion: drifting
   clouds/birds, the completion pulse, and long CSS transitions. The bird
   frame-swap interval is stopped separately in JS. */
@media (prefers-reduced-motion: reduce) {
  .hero-cloud,
  .hero-bird-1, .hero-bird-2 { animation: none !important; }
  .hero-bird { display: none; }
  .tl-viz-wrapper.tl-complete #timeline-viz { animation: none !important; }
  .pulse-entry { animation: none !important; }
  body { transition: none !important; }
  .tl-intro-inner { transition: opacity 0.01ms linear !important; }
}
</style>
</head>
<body>
<div id="policy-history" class="policy-history-section">
  <div class="tl-intro-section">
    <div class="hero-sky" aria-hidden="true">
      <img class="hero-cloud hero-cloud-1" src="images/cloud.png" alt="">
      <img class="hero-cloud hero-cloud-2" src="images/cloud.png" alt="">
      <img class="hero-cloud hero-cloud-3" src="images/cloud.png" alt="">
      <div class="hero-bird hero-bird-1">
        <img class="hero-bird-frame" src="images/bird-frames/f001.png" alt="">
      </div>
      <div class="hero-bird hero-bird-2">
        <img class="hero-bird-frame" src="images/bird-frames/f001.png" alt="">
      </div>
    </div>
    <div class="tl-intro-inner">
      <h2 class="tl-intro-title">Drawing the Boundaries of Belonging</h2>
      <p class="tl-intro-subtitle">How America built its gates of membership</p>
    </div>
  </div>
  <div class="tl-timeline-container">
    <div class="tl-viz-wrapper">
      <canvas id="river-canvas" class="tl-river"></canvas>
      <svg id="timeline-viz" viewBox="0 0 1200 800"></svg>
    </div>
  </div>
</div>

<!-- Policy dossier modal — shared by both card treatments, opened via openDossier(index) -->
<div class="dossier-overlay" id="dossierOverlay" onclick="if(event.target===this) closeDossier()">
  <div class="dossier" id="dossierContent"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/MotionPathPlugin.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/SplitText.min.js"></script>
<script>
// Main scrollytelling spine: 30 narrative scenes.
const policies = [
  {
    "id": "headright-1618",
    "year": "1618",
    "title": "Settlement Is Migration Policy",
    "anchor": "Virginia Headright System",
    "type": "Colonial policy",
    "role": "build",
    "gates": [
      "labor",
      "entry",
      "authority"
    ],
    "cardText": "The colonies needed people. Virginia used land to attract them: financing passage could bring a claim to acreage. Migration was part of how colonial settlements acquired labor, occupied territory, and expanded.",
    "transition": "But the people who built the colonies did not all arrive on the same terms.",
    "dossier": {
      "what": [
        "Virginia’s headright system tied land claims to the financing of migration. In a land-rich, labor-poor colony, attracting settlers and workers was part of colonial state-building."
      ],
      "why": [
        "The story begins before a national border existed. Early migration policy was often about recruiting population, labor, and settlement rather than excluding newcomers."
      ],
      "context": [
        "Colonial governments used land, local naturalization, taxes, servitude rules, transportation, and banishment to shape who arrived and on what terms."
      ],
      "afterlife": [
        "The basic relationship between migration, labor demand, and territorial expansion returns repeatedly—from contract labor to the Bracero Program and modern temporary-worker systems."
      ],
      "supporting": [
        "Indentured migration",
        "Pennsylvania settlement promotion",
        "British transportation of convicts",
        "Royal Proclamation of 1763 and western settlement controls"
      ],
      "story": {
        "title": "Four routes into colonial America",
        "body": [
          "A settler seeking land, an indentured servant working off a passage debt, a transported convict, and an African person forced across the Atlantic could all arrive in British North America—yet law placed them on radically different paths. The dossier should invite readers to compare those paths rather than treat “migration” as a single experience."
        ]
      },
      "links": [
        {
          "label": "National Park Service — colonial settlement and headrights",
          "tag": "Further reading",
          "url": "https://www.nps.gov/gewa/learn/historyculture/upload/GEWA-HRS-2023-508-2.pdf",
          "note": "Background on colonial settlement and land systems."
        }
      ],
      "people": [
        {
          "role": "Landholder · Northampton County",
          "name": "Anthony Johnson",
          "body": [
            "A free Black landholder, Johnson patented 250 acres in Northampton County in 1651 using five headrights, including one for his son Richard. His record shows the headright system operating in a specific land claim.",
            "Because headrights could be transferred, the patent does not prove Johnson personally transported every person named."
          ],
          "link": {
            "label": "View the archival record",
            "url": "https://enduringconnections.salisbury.edu/r/free_black_families_colonial_delmarva_heinegg/53"
          }
        },
        {
          "role": "Indentured servant · Virginia",
          "name": "Richard Frethorne",
          "body": [
            "Frethorne came to Virginia as an indentured servant. In 1623, he wrote to his parents about hunger, illness, and hard labor.",
            "His letters are not headright records, but they preserve a rare first-person account of the labor system surrounding colonial migration."
          ],
          "link": {
            "label": "Read Frethorne's letters",
            "url": "https://www.virtualjamestown.org/exist/cocoon/jamestown/fha/J1012"
          }
        }
      ]
    }
  },
  {
    "id": "partus-1662",
    "year": "1662",
    "title": "Movement Does Not Mean Equal Belonging",
    "anchor": "Virginia Act on Partus Sequitur Ventrem",
    "type": "Colonial law",
    "role": "contradiction",
    "gates": [
      "status",
      "rights",
      "labor"
    ],
    "cardText": "Virginia made a child’s free or enslaved status follow the mother. Forced migration was becoming hereditary: movement into the colony could lead to radically different futures for newcomers and their descendants.",
    "transition": "Before America defined citizenship, law was already defining very different kinds of belonging.",
    "dossier": {
      "what": [
        "Virginia enacted a rule making a child’s legal condition follow the condition of the mother. In a slave society, the rule helped make enslavement inheritable across generations."
      ],
      "why": [
        "It exposes the project’s first major contradiction: colonial America encouraged some people to migrate and settle while law converted the coerced movement of others into a hereditary racial status."
      ],
      "context": [
        "The rule developed as English colonial law was hardening distinctions among free people, indentured servants, and enslaved Africans and their descendants."
      ],
      "afterlife": [
        "The inherited-status system shaped slavery until emancipation and forms an essential prehistory to later debates over citizenship, race, and national membership."
      ],
      "supporting": [
        "1619 arrival of captive Africans at Point Comfort",
        "Elizabeth Key’s 1656 freedom suit",
        "Virginia slave codes",
        "Transportation Act of 1717"
      ],
      "story": {
        "title": "Status across generations",
        "body": [
          "A family-tree view can show the legal force of the rule more clearly than another paragraph: once a mother was legally enslaved, the status of her children followed hers. The human consequence was not simply exclusion at a border, but a legal condition transmitted through descent."
        ]
      },
      "links": [
        {
          "label": "National Park Service — slavery and colonial Virginia",
          "tag": "Further reading",
          "url": "https://irma.nps.gov/DataStore/DownloadFile/673096",
          "note": "Historical context for slavery and law in colonial Virginia."
        }
      ],
      "people": []
    }
  },
  {
    "id": "constitution-1787",
    "year": "1787",
    "title": "A Nation Needs Members",
    "anchor": "U.S. Constitution — Naturalization Clause",
    "type": "Constitutional provision",
    "role": "build",
    "gates": [
      "citizenship",
      "authority"
    ],
    "cardText": "Independence changed the question. The colonies had needed settlers; the new nation needed a rule for membership. The Constitution gave Congress power to establish a uniform Rule of Naturalization.",
    "transition": "Congress would soon draw that national membership boundary in racial terms.",
    "dossier": {
      "what": [
        "Article I gave Congress power to establish a uniform rule of naturalization. That shifted formal naturalization from a patchwork of colonial and state practices toward a national framework."
      ],
      "why": [
        "The problem changed from “How do we populate colonies?” to “Who can formally become a member of the United States?”"
      ],
      "context": [
        "Colonial naturalization experiments, the Plantation Act of 1740, and the Declaration of Independence’s complaint about blocked naturalization all form part of the lead-in."
      ],
      "afterlife": [
        "Naturalization would become one of the first places where the new federal government explicitly defined the boundaries of American membership."
      ],
      "supporting": [
        "Plantation Act of 1740",
        "1776 Declaration grievance on naturalization and migration",
        "Constitution’s Migration or Importation Clause"
      ],
      "links": [
        {
          "label": "Constitution Annotated — Article I, Section 8",
          "tag": "Primary law",
          "url": "https://constitution.congress.gov/browse/article-1/section-8/",
          "note": "Congress’s enumerated powers, including naturalization."
        }
      ],
      "people": []
    }
  },
  {
    "id": "naturalization-1790",
    "year": "1790",
    "title": "Citizenship Begins With a Racial Boundary",
    "anchor": "Naturalization Act of 1790",
    "type": "Law",
    "role": "build",
    "gates": [
      "citizenship"
    ],
    "landmark": true,
    "quote": "free white person",
    "stamp": "1790",
    "cardText": "The first federal naturalization law limited eligibility to a “free white person.” The United States created a process for becoming American while simultaneously defining who could use it.",
    "transition": "But citizenship was only one boundary. Government also had to decide what power it held over people who were not citizens.",
    "dossier": {
      "what": [
        "The first federal naturalization statute limited naturalization to a “free white person” who met residence and character requirements."
      ],
      "why": [
        "Race was not added to U.S. naturalization law later; it was embedded in the federal system from its first statute."
      ],
      "context": [
        "Later naturalization statutes changed residence and procedural rules while retaining racial eligibility restrictions."
      ],
      "afterlife": [
        "The racial-prerequisite language generated generations of disputes over who counted as “white,” including cases involving Chinese, Japanese, South Asian, and other immigrants, before racial bars were finally removed in 1952."
      ],
      "supporting": [
        "Naturalization Act of 1795",
        "Naturalization Act of 1802",
        "In re Ah Yup (1878)",
        "Ozawa v. United States (1922)",
        "United States v. Bhagat Singh Thind (1923)"
      ],
      "story": {
        "title": "What did “white” mean in law?",
        "body": [
          "The phrase looked short and categorical, but courts spent decades deciding who fit inside it. This is a useful dossier for showing that racial categories were not self-executing facts: judges and officials actively constructed their legal meaning."
        ]
      },
      "links": [
        {
          "label": "Library of Congress — Naturalization Act of 1790",
          "tag": "Primary source",
          "url": "https://tile.loc.gov/storage-services/service/rbc/rbpe/rbpe21/rbpe213/21301000/21301000.pdf",
          "note": "Contemporary printed text of the first federal naturalization statute."
        }
      ],
      "people": []
    }
  },
  {
    "id": "alien-enemies-1798",
    "year": "1798",
    "title": "The Outsider Becomes a Security Category",

const dossiers = Object.fromEntries(policies.map((policy, index) => [index, policy.dossier || null]));

const ROLE_LABELS = {
  build: 'System built',
  rebuild: 'System rebuilt',
  contradiction: 'Contradiction exposed',
  pressure: 'Pressure / turning point'
};

function escHTML(value) {
  return String(value == null ? '' : value)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
}
function paragraphsHTML(value) {
  const arr = Array.isArray(value) ? value : (value ? [value] : []);
  return arr.map(p => `<p>${escHTML(p)}</p>`).join('');
}
function simpleListHTML(items, className='dossier-bullets') {
  if (!items || !items.length) return '';
  return `<ul class="${className}">${items.map(item => `<li>${escHTML(item)}</li>`).join('')}</ul>`;
}
function resourceListHTML(links) {
  if (!links || !links.length) return '<p class="dossier-empty-note">Curated sources are still being assembled.</p>';
  return `<ul class="dossier-links">${links.map(l => `<li><div><a href="${escHTML(l.url)}" target="_blank" rel="noopener">${escHTML(l.label)}</a>${l.note ? `<p class="dossier-link-note">${escHTML(l.note)}</p>` : ''}</div><span class="tag">${escHTML(l.tag || 'Source')}</span></li>`).join('')}</ul>`;
}
// Bare photo — no card/border/shadow, sized at its own aspect ratio so a
// document scan is never cropped. Shared by the in-app card and the
// standalone page; omitted entirely when the policy has no image yet.
function dossierPhotoHTML(policy) {
  if (!policy.image) return '';
  return `
    <img class="dossier-photo" src="${escHTML(policy.image)}" alt="${escHTML(policy.title)}" loading="lazy" decoding="async">
    ${policy.imageCaption ? `<div class="dossier-photo-caption">${escHTML(policy.imageCaption)}</div>` : ''}`;
}
function peopleTabHTML(people) {
  if (!people || !people.length) return '<p class="dossier-empty-note">Human profiles for this dossier are still being researched.</p>';
  return people.map((p, i) => `
    <div class="dossier-person">
      <div class="dossier-person-num">${String(i + 1).padStart(2, '0')}</div>
      <div>
        <div class="dossier-person-role">${escHTML(p.role)}</div>
        <h3>${escHTML(p.name)}</h3>
        <div class="dossier-body">${paragraphsHTML(p.body)}</div>
        ${p.link ? `<a class="dossier-person-link" href="${escHTML(p.link.url)}" target="_blank" rel="noopener">${escHTML(p.link.label)} ↗</a>` : ''}
      </div>
    </div>`).join('');
}
// Policy/People/Resources tab content shared by the in-app card (openDossier)
// and the standalone page (buildDossierPageHTML) — same markup, different chrome.
function dossierTabPanelsHTML(policy, d) {
  const storyHTML = d.story ? `
    <div class="dossier-section dossier-story">
      <div class="dossier-h">Human lens / story</div>
      <h3>${escHTML(d.story.title)}</h3>
      <div class="dossier-body">${paragraphsHTML(d.story.body)}</div>
    </div>` : '';
  const supportingHTML = d.supporting && d.supporting.length ? `
    <div class="dossier-section">
      <div class="dossier-h">Supporting laws, cases & actions</div>
      ${simpleListHTML(d.supporting)}
    </div>` : '';
  const callbackHTML = policy.callbacks && policy.callbacks.length ? `
    <div class="dossier-section">
      <div class="dossier-h">Connections across time</div>
      <div class="dossier-callbacks">${policy.callbacks.map(c => `<span>${escHTML(c.replace(/-/g,' '))}</span>`).join('')}</div>
    </div>` : '';

  return `
    <div class="dossier-panel" data-panel="policy">
      <div class="dossier-section">
        <div class="dossier-h">What happened</div>
        <div class="dossier-body">${paragraphsHTML(d.what)}</div>
      </div>
      <div class="dossier-section">
        <div class="dossier-h">Why it matters in this story</div>
        <div class="dossier-body">${paragraphsHTML(d.why)}</div>
      </div>
      ${storyHTML}
      <div class="dossier-section">
        <div class="dossier-h">Historical context</div>
        <div class="dossier-body">${paragraphsHTML(d.context)}</div>
      </div>
      ${supportingHTML}
      ${callbackHTML}
      <div class="dossier-section">
        <div class="dossier-h">What comes after</div>
        <div class="dossier-body">${paragraphsHTML(d.afterlife)}</div>
      </div>
      ${policy.quote ? `<div class="dossier-section"><div class="dossier-h">Key language</div><div class="dossier-quote">${escHTML(policy.quote)}</div></div>` : ''}
    </div>
    <div class="dossier-panel" data-panel="people" hidden>
      ${peopleTabHTML(d.people)}
    </div>
    <div class="dossier-panel" data-panel="resources" hidden>
      <div class="dossier-h">Curated resources</div>
      ${resourceListHTML(d.links)}
    </div>`;
}
function dossierTabsNavHTML() {
  return `
    <nav class="dossier-tabs" role="tablist">
      <button type="button" role="tab" aria-selected="true" data-tab="policy" onclick="switchDossierTab(this,'policy')">The Policy</button>
      <button type="button" role="tab" aria-selected="false" data-tab="people" onclick="switchDossierTab(this,'people')">People</button>
      <button type="button" role="tab" aria-selected="false" data-tab="resources" onclick="switchDossierTab(this,'resources')">Resources</button>
    </nav>`;
}
function switchDossierTab(btn, name) {
  const scope = btn.closest('.dossier') || btn.closest('.fp-body');
  scope.querySelectorAll('[role="tab"]').forEach(b => b.setAttribute('aria-selected', String(b === btn)));
  scope.querySelectorAll('.dossier-panel').forEach(p => p.hidden = p.dataset.panel !== name);
}

function openDossier(index) {
  const overlay = document.getElementById('dossierOverlay');
  const mount = document.getElementById('dossierContent');
  const policy = policies[index];
  const d = dossiers[index];

  if (!policy || !d) return;

  mount.style.setProperty('--role-accent', getRoleColor(policy));

  mount.innerHTML = `
    <button class="dossier-close" onclick="closeDossier()" aria-label="Close dossier">Close</button>
    <div class="dossier-top">
      <button class="dossier-newtab" onclick="openDossierPage(${index})">Open in new tab <svg viewBox="0 0 12 12" fill="none"><path d="M4.5 2H2.5a.5.5 0 0 0-.5.5v7a.5.5 0 0 0 .5.5h7a.5.5 0 0 0 .5-.5v-2M7 2h3v3M10 2 5.5 6.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

    ${dossierPhotoHTML(policy)}
    <dl class="dossier-meta">
      <div><dt>Role</dt><dd>${escHTML(ROLE_LABELS[policy.role] || policy.role)}</dd></div>
      <div><dt>Type</dt><dd>${escHTML(policy.type)}</dd></div>
      <div><dt>Boundaries</dt><dd>${escHTML((policy.gates || []).join(' · '))}</dd></div>
      <div><dt>Anchor year</dt><dd>${escHTML(policy.year)}</dd></div>
    </dl>
    ${dossierTabsNavHTML()}
    ${dossierTabPanelsHTML(policy, d)}
    <button class="dossier-return" onclick="closeDossier()">← Return to story</button>`;
  overlay.setAttribute('role', 'dialog');
  overlay.setAttribute('aria-modal', 'true');
  overlay.setAttribute('aria-label', `${policy.title} dossier`);
  overlay.classList.add('is-open');
}

function closeDossier() {
  document.getElementById('dossierOverlay').classList.remove('is-open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDossier(); });

// Open the current policy's dossier as its own self-contained page in a new tab.
// Builds a full standalone HTML document (fonts + styles inlined) so it works
// offline from file:// with no server and no extra files. Triggered by a click,
// so it isn't caught by popup blockers.
function openDossierPage(index) {
  const policy = policies[index];
  const d = dossiers[index];
  const win = window.open('', '_blank');
  if (!win) return; // popup blocked — fail quietly, modal stays open
  win.document.open();
  win.document.write(buildDossierPageHTML(policy, d));
  win.document.close();
}

// Interpolates between two '#rrggbb' colors — used to blend the river into
// the deeper sea color as it widens toward the estuary/mouth.
function lerpColor(hexA, hexB, t) {
  const a = parseInt(hexA.slice(1), 16), b = parseInt(hexB.slice(1), 16);
  const ar = (a >> 16) & 255, ag = (a >> 8) & 255, ab = a & 255;
  const br = (b >> 16) & 255, bg = (b >> 8) & 255, bb = b & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${bl})`;
}

function getPathDistanceToPoint(pointAtFrac, totalLen, len, point) {
  const pt = pointAtFrac(len / totalLen);
  const dx = pt.x - point.x;
  const dy = pt.y - point.y;
  return dx * dx + dy * dy;
}
